  const OBJ_TABS = [
    { id: 'anual', label: 'Anual' },
    { id: 'trimestral', label: 'Trimestral' },
    { id: 'mensual', label: 'Mensual' },
    { id: 'semanal', label: 'Semanal' },
  ];
  // Los 4 pilares del Manual de Desarrollo Personal.
  const PILLARS = [
    { id: 'prof', label: 'Profesional' },
    { id: 'fin', label: 'Finanzas' },
    { id: 'salud', label: 'Salud' },
    { id: 'creci', label: 'Crecimiento personal' },
  ];

  function fmtKey(d) {
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  // Fecha fija en la que arrancó el seguimiento anual — así el período
  // (y por lo tanto "días registrados", rachas, etc.) no se acorta cada
  // día que abrís la app, sino que siempre cubre desde acá hasta fin de año.
  // Usa la misma fecha que HABITS_START: el uso real arranca el 1° de
  // septiembre de 2026.
  const TRACKING_START = HABITS_START;

  function periodStart() {
    return new Date(TRACKING_START.getFullYear(), TRACKING_START.getMonth(), TRACKING_START.getDate());
  }
  function periodEnd(d) {
    return new Date(d.getFullYear(), 11, 31);
  }
  function periodLabel(d) {
    return `${d.getFullYear()} · días restantes`;
  }
  function keyToDate(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  // Hábitos que ya estaban dados de alta en la fecha indicada — el
  // cumplimiento de cada día solo se calcula sobre estos.
  function activeHabitsOn(date) {
    return HABITS.filter(h => !h.activeSince || date >= h.activeSince);
  }

  function isCompliant(habit, val, date) {
    const cfg = configAt(date || today);
    if (val === undefined || val === null || val === '') return false;
    if (habit.type === 'bool') return val === true;
    if (habit.type === 'time') return val <= (habit.id === 'wake' ? cfg.wakeTarget : habit.target);
    if (habit.type === 'sleep') {
      const n = Number(val);
      const min = habit.id === 'sleep' ? cfg.sleepMin : habit.min;
      const max = habit.id === 'sleep' ? cfg.sleepMax : habit.max;
      return !isNaN(n) && n >= min && n <= max;
    }
    if (habit.type === 'liters') {
      const n = Number(val);
      const min = habit.id === 'water' ? cfg.waterMin : habit.min;
      return !isNaN(n) && n >= min;
    }
    return false;
  }

  // Distingue cumplido / no cumplido / pendiente (sin responder). Un
  // "pendiente" nunca debe tratarse como "no cumplido" en la UI.
  function habitStatus(habit, val, date) {
    if (habit.type === 'bool') {
      if (val === true) return 'ok';
      if (val === false) return 'no';
      return 'pending';
    }
    if (val === '' || val === undefined || val === null) return 'pending';
    return isCompliant(habit, val, date) ? 'ok' : 'no';
  }
  // Desglose del día para la pantalla "Hoy": cumplidos / no cumplidos /
  // pendientes, respetando activeSince y sin tratar "pendiente" como
  // "no cumplido". Devuelve también la lista de hábitos pendientes para
  // poder ofrecer un acceso directo a completarlos.
  function dayBreakdown(entry, date) {
    // Para la pantalla "Hoy" mostramos SIEMPRE los 11 hábitos actuales
    // como lista de tareas del día, sin importar su fecha de alta.
    // activeSince solo protege que el % histórico no se recalcule
    // retroactivamente (ver computeStatsForRange) — acá no aplica, porque
    // "Hoy" es simplemente "qué me falta completar hoy", no una métrica.
    const active = HABITS;
    let compliant = 0, notCompliant = 0, pending = 0;
    const pendingHabits = [];
    active.forEach(h => {
      const st = habitStatus(h, entry ? entry[h.id] : undefined, date);
      if (st === 'ok') compliant++;
      else if (st === 'no') notCompliant++;
      else { pending++; pendingHabits.push(h); }
    });
    return { total: active.length, compliant, notCompliant, pending, pendingHabits };
  }

  function fieldAnswered(entry, id) {
    if (!entry) return false;
    const v = entry[id];
    return v !== undefined && v !== null && v !== '';
  }
  function sectionStat(doneCount, total) {
    return { done: doneCount, total, complete: total > 0 && doneCount === total };
  }
  // Campos de salud sin responder hoy (respetando que peso/cintura solo
  // se piden los sábados) — para mostrarlos como chips de "pendiente" en
  // la pantalla Hoy, igual que los hábitos.
  function saludPendingChips() {
    const todayEntry = entries[fmtKey(today)];
    const isSaturday = today.getDay() === 6;
    const items = [];
    SLEEP_FIELDS.forEach(s => {
      if (!fieldAnswered(todayEntry, s.id)) {
        items.push({ label: s.label, cat: 'salud', tab: s.time === 'morning' ? 'manana' : 'noche' });
      }
    });
    if (isSaturday) {
      BODY_FIELDS.forEach(b => {
        if (!fieldAnswered(todayEntry, b.id)) items.push({ label: b.label, cat: 'salud', tab: 'manana' });
      });
    }
    if (!fieldAnswered(todayEntry, 'training_done')) {
      items.push({ label: 'Entrenamiento realizado', cat: 'salud', tab: 'entrenamiento' });
    }
    return items;
  }
  // Desglose de "secciones" del día (no hábito por hábito, sino por
  // pantalla: rutina de la mañana, de la noche, cada sub-sección de salud,
  // y semanal los domingos) — para la pantalla Hoy.
  function sectionCompletion() {
    const todayEntry = entries[fmtKey(today)];
    // Igual que dayBreakdown: la lista de tareas de "Hoy" siempre muestra
    // los hábitos actuales completos, sin gate de activeSince.
    const morning = HABITS.filter(h => h.group === 'morning');
    const night = HABITS.filter(h => h.group === 'night');
    const isSaturday = today.getDay() === 6;
    // Peso y cintura se miden 1 vez por semana, los sábados — el resto de
    // la semana no cuentan como "pendientes".
    const saludMorningIds = SLEEP_FIELDS.filter(s => s.time === 'morning').map(s => s.id)
      .concat(isSaturday ? BODY_FIELDS.map(b => b.id) : []);
    const saludEveningIds = SLEEP_FIELDS.filter(s => s.time === 'evening').map(s => s.id);
    const countAnswered = ids => ids.filter(id => fieldAnswered(todayEntry, id)).length;

    const result = {
      morning: sectionStat(morning.filter(h => fieldAnswered(todayEntry, h.id)).length, morning.length),
      night: sectionStat(night.filter(h => fieldAnswered(todayEntry, h.id)).length, night.length),
      saludMorning: sectionStat(countAnswered(saludMorningIds), saludMorningIds.length),
      training: sectionStat(countAnswered(['training_done']), 1),
      saludEvening: sectionStat(countAnswered(saludEveningIds), saludEveningIds.length),
      weekly: today.getDay() === 0
        ? sectionStat(WEEKLY_HABITS.filter(h => fieldAnswered(todayEntry, h.id)).length, WEEKLY_HABITS.length)
        : null,
    };
    return result;
  }
  function habitTargetDesc(habit, date) {
    const cfg = configAt(date || today);
    if (habit.id === 'wake') return `Meta: antes de las ${cfg.wakeTarget}`;
    if (habit.id === 'sleep') return `Meta: entre ${cfg.sleepMin} y ${cfg.sleepMax} h`;
    if (habit.id === 'water') return `Meta: mínimo ${cfg.waterMin} litros`;
    return habit.desc;
  }

  function dayScore(entry, date) {
    if (!entry) return null;
    const active = date ? activeHabitsOn(date) : HABITS;
    if (active.length === 0) return null;
    let has = false;
    let ok = 0;
    active.forEach(h => {
      const v = entry[h.id];
      if (v !== undefined && v !== null && v !== '') has = true;
      if (isCompliant(h, v, date)) ok++;
    });
    if (!has) return null;
    return ok / active.length;
  }

  // ---- Cache local (IndexedDB) + cola de sincronización ----
  // Google Sheets sigue siendo la fuente principal. IndexedDB es solo un
  // respaldo para no perder datos si Apps Script está caído o no hay
  // conexión. Nota: dentro del panel de vista previa de Claude.ai, el
  // acceso a IndexedDB puede estar bloqueado por el sandbox del navegador;
  // funciona con normalidad cuando este archivo se abre como página propia
  // (doble clic, o servido desde tu propio hosting/servidor local).
  const IDB_NAME = 'dp_cache_v1';
  const IDB_STORE = 'kv';
  function idbOpen() {
    return new Promise((resolve, reject) => {
      if (typeof indexedDB === 'undefined') { reject(new Error('no-indexeddb')); return; }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbGet(key) {
    try {
      const db = await idbOpen();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    } catch (e) { return undefined; }
  }
  async function idbSet(key, value) {
    try {
      const db = await idbOpen();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    } catch (e) { return false; }
  }
  async function saveSnapshotToCache() {
    await idbSet('snapshot', { entries, goals, configHistory, savedAt: Date.now() });
  }
  async function savePendingQueue() { await idbSet('pendingQueue', pendingQueue); }
  async function loadPendingQueue() {
    const q = await idbGet('pendingQueue');
    return Array.isArray(q) ? q : [];
  }
  function coerceConfig(raw) {
    const c = { ...CONFIG_DEFAULTS, ...(raw || {}) };
    ['sleepMin','sleepMax','waterMin','dailyGoalPct','trainingDaysPerWeek'].forEach(k => {
      const n = Number(c[k]);
      c[k] = isNaN(n) ? CONFIG_DEFAULTS[k] : n;
    });
    if (!c.wakeTarget) c.wakeTarget = CONFIG_DEFAULTS.wakeTarget;
    return c;
  }
  // El Apps Script guarda/devuelve cada versión de la config con nombres de
  // columna (snake_case, igual que el resto de las hojas); acá se traduce
  // a los nombres internos (camelCase). "effective_from" es la fecha desde
  // la que rige esa versión.
  function fromConfigSheetEntry(raw) {
    if (!raw) return null;
    return {
      effectiveFrom: raw.effective_from,
      wakeTarget: raw.wake_target,
      sleepMin: raw.sleep_min,
      sleepMax: raw.sleep_max,
      waterMin: raw.water_min,
      dailyGoalPct: raw.daily_goal_pct,
      trainingDaysPerWeek: raw.training_days_goal,
    };
  }
  function sortConfigHistory() {
    configHistory.sort((a, b) => a.effectiveFrom < b.effectiveFrom ? -1 : (a.effectiveFrom > b.effectiveFrom ? 1 : 0));
  }

  async function sendToServer(payload) {
    const delays = [400, 900, 1800];
    for (let attempt = 0; attempt <= delays.length; attempt++) {
      try {
        const res = await fetch(WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data && data.ok) return true;
      } catch (e) { /* reintenta */ }
      if (attempt < delays.length) await new Promise(r => setTimeout(r, delays[attempt]));
    }
    return false;
  }

  // Intenta guardar en el momento; si falla, encola para reintentar más
  // tarde (sin perder el cambio) y lo deja respaldado en IndexedDB.
  async function persistOrQueue(payload) {
    syncStatus = 'saving';
    const ok = await sendToServer(payload);
    if (ok) {
      syncStatus = 'synced';
      if (pendingQueue.length > 0) await flushPendingQueue();
    } else {
      pendingQueue.push({ payload, ts: Date.now(), attempts: 0 });
      await savePendingQueue();
      syncStatus = 'pending';
    }
    return ok;
  }

  let isFlushingQueue = false; // evita que dos "vaciados" de la cola corran al mismo tiempo
  const MAX_QUEUE_ATTEMPTS = 8; // si un pedido falla tantas veces, se descarta (payload roto/viejo)

  async function flushPendingQueue() {
    if (isFlushingQueue) return; // ya hay un vaciado en curso — no arrancar otro en paralelo
    if (pendingQueue.length === 0) return;
    isFlushingQueue = true;
    try {
      const remaining = [];
      for (const item of pendingQueue) {
        const ok = await sendToServer(item.payload);
        if (!ok) {
          const attempts = (item.attempts || 0) + 1;
          if (attempts < MAX_QUEUE_ATTEMPTS) {
            remaining.push({ ...item, attempts });
          } else {
            console.warn('Descartando un pedido pendiente que falló repetidamente:', item.payload);
          }
        }
      }
      pendingQueue = remaining;
      await savePendingQueue();
      syncStatus = pendingQueue.length > 0 ? 'pending' : 'synced';
    } finally {
      isFlushingQueue = false;
    }
  }

  async function loadAll() {
    try {
      const res = await fetch(`${WEBAPP_URL}?key=${encodeURIComponent(SECRET_KEY)}`);
      const data = await res.json();
      if (!data || !data.ok) throw new Error('bad-response');
      entries = {};
      if (data.entries) {
        Object.keys(data.entries).forEach(date => { entries[date] = fromSheetEntry(data.entries[date]); });
      }
      goals = {};
      if (data.goals) {
        Object.keys(data.goals).forEach(key => {
          const g = data.goals[key];
          goals[key] = {
            prof: g.objetivo_profesional || '',
            fin: g.objetivo_finanzas || '',
            salud: g.objetivo_salud || '',
            creci: g.objetivo_crecimiento || '',
            tipo: g.periodo_tipo || '',
          };
        });
      }
      configHistory = [];
      if (Array.isArray(data.config)) {
        data.config.forEach(row => {
          const c = fromConfigSheetEntry(row);
          if (c && c.effectiveFrom) configHistory.push(coerceConfig(c));
        });
        sortConfigHistory();
      }
      CONFIG = configAt(today);
      syncStatus = 'synced';
      await saveSnapshotToCache();
    } catch (e) {
      console.error('habit-tracker load error', e);
      const cached = await idbGet('snapshot');
      if (cached) {
        entries = cached.entries || {};
        goals = cached.goals || {};
        configHistory = Array.isArray(cached.configHistory) ? cached.configHistory.map(coerceConfig) : [];
        sortConfigHistory();
        CONFIG = configAt(today);
        syncStatus = 'offline';
      } else {
        entries = {};
        goals = {};
        configHistory = [];
        CONFIG = { ...CONFIG_DEFAULTS };
        syncStatus = 'error';
      }
    }
    pendingQueue = await loadPendingQueue();
    if (syncStatus === 'synced' && pendingQueue.length > 0) {
      await flushPendingQueue();
    }
  }

  async function persist(key, f) {
    const score = dayScore(f, keyToDate(key));
    const payload = {
      key: SECRET_KEY,
      fecha: key,
      entry: toSheetEntry(f, score),
    };
    await saveSnapshotToCache();
    const ok = await persistOrQueue(payload);
    storageOK = ok;
    return ok;
  }

  async function removeFromSheet(key) {
    await saveSnapshotToCache();
    return persistOrQueue({ key: SECRET_KEY, fecha: key, action: 'delete' });
  }

  function loadFormFromEntry() {
    const key = fmtKey(selectedDate);
    const e = entries[key] || {};
    form = {};
    HABITS.forEach(h => { form[h.id] = e[h.id] !== undefined ? e[h.id] : (h.type === 'bool' ? null : ''); });
    WEEKLY_HABITS.forEach(h => { form[h.id] = e[h.id] !== undefined ? e[h.id] : null; });
    SLEEP_FIELDS.forEach(s => { form[s.id] = (e[s.id] !== undefined && e[s.id] !== null) ? e[s.id] : ''; });
    BODY_FIELDS.forEach(b => { form[b.id] = (e[b.id] !== undefined && e[b.id] !== null) ? e[b.id] : ''; });
    TRAINING_FIELDS.forEach(t => { form[t.id] = (e[t.id] !== undefined && e[t.id] !== null) ? e[t.id] : ''; });
    form.training_done = e.training_done !== undefined ? e.training_done : null;
    form.training_type = e.training_type || '';
    if (e.sleep_h !== undefined || e.sleep_m !== undefined) {
      form.sleep_h = e.sleep_h !== undefined ? e.sleep_h : '';
      form.sleep_m = e.sleep_m !== undefined ? e.sleep_m : '';
    } else {
      const parts = decomposeSleep(form.sleep);
      form.sleep_h = parts.h;
      form.sleep_m = parts.m;
    }
  }

  function decomposeSleep(dec) {
    if (dec === '' || dec === undefined || dec === null || isNaN(Number(dec))) return { h: '', m: '' };
    const totalMin = Math.round(Number(dec) * 60);
    return { h: Math.floor(totalMin / 60), m: totalMin % 60 };
  }

  function recomputeSleep() {
    const hStr = form.sleep_h, mStr = form.sleep_m;
    if ((hStr === '' || hStr === undefined) && (mStr === '' || mStr === undefined)) { form.sleep = ''; return; }
    const h = (hStr === '' || hStr === undefined) ? 0 : Number(hStr);
    const m = (mStr === '' || mStr === undefined) ? 0 : Number(mStr);
    form.sleep = Math.round((h + m / 60) * 100) / 100;
  }

  function goToDate(d) {
    selectedDate = new Date(d);
    saveMsg = '';
    loadFormFromEntry();
    render();
  }

  function toggleBool(id) {
    const cur = form[id];
    if (cur === true) form[id] = false;
    else if (cur === false) form[id] = null;
    else form[id] = true;
    render();
  }
  function setField(id, val) {
    form[id] = val;
    render();
  }
  function setSleepPart(part, val) {
    if (part === 'h') form.sleep_h = val;
    else form.sleep_m = val;
    recomputeSleep();
    render();
  }

  async function saveDay() {
    const key = fmtKey(selectedDate);
    entries[key] = { ...form };
    const ok = await persist(key, form);
    saveMsg = ok ? 'Guardado ✓' : 'Falló el guardado — revisá tu conexión y tocá "Guardar día" de nuevo.';
    render();
    setTimeout(() => { saveMsg = ''; render(); }, 2200);
  }

  async function clearDay() {
    const key = fmtKey(selectedDate);
    delete entries[key];
    await removeFromSheet(key);
    loadFormFromEntry();
    render();
  }

  function heatColor(pct) {
    if (pct === null) return null;
    // interpolate predawn -> sunrise
    const c1 = [35, 44, 61];    // predawn
    const c2 = [232, 163, 61];  // sunrise
    const t = pct;
    const r = Math.round(c1[0] + (c2[0]-c1[0])*t);
    const g = Math.round(c1[1] + (c2[1]-c1[1])*t);
    const b = Math.round(c1[2] + (c2[2]-c1[2])*t);
    return `rgb(${r},${g},${b})`;
  }

  // Genera un gráfico de líneas en SVG puro (sin librerías externas) para
  // no depender de ningún CDN. `points` = [{ label, value }], value en null
  // = sin dato ese día (corta la línea, no la interpola).
  function lineChartSvg(points, opts) {
    const o = Object.assign({ min: 0, max: 100, unit: '%', color: 'var(--sunrise-deep)', height: 170 }, opts || {});
    const withData = points.filter(p => p.value !== null && p.value !== undefined);
    if (withData.length === 0) {
      return `<div class="chart-empty">Sin datos registrados en este período todavía.</div>`;
    }
    const W = 600, H = o.height, padL = 40, padR = 14, padT = 14, padB = 26;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const n = points.length;
    const xAt = i => n <= 1 ? padL : padL + (i/(n-1)) * innerW;
    const yAt = v => padT + (1 - (Math.min(Math.max(v, o.min), o.max) - o.min) / (o.max - o.min || 1)) * innerH;

    // segmentos continuos (corta donde value es null)
    const segments = [];
    let cur = [];
    points.forEach((p, i) => {
      if (p.value === null || p.value === undefined) {
        if (cur.length) segments.push(cur);
        cur = [];
      } else {
        cur.push(`${xAt(i).toFixed(1)},${yAt(p.value).toFixed(1)}`);
      }
    });
    if (cur.length) segments.push(cur);
    const linesHtml = segments.map(seg => seg.length > 1
      ? `<polyline points="${seg.join(' ')}" fill="none" stroke="${o.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />`
      : `<circle cx="${seg[0].split(',')[0]}" cy="${seg[0].split(',')[1]}" r="3" fill="${o.color}" />`
    ).join('');
    const dotsHtml = n <= 62 ? points.map((p, i) => (p.value === null || p.value === undefined) ? '' :
      `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.value).toFixed(1)}" r="2.3" fill="${o.color}" />`
    ).join('') : '';

    const midVal = (o.min + o.max) / 2;
    const gridHtml = [o.min, midVal, o.max].map(v => `
      <line x1="${padL}" y1="${yAt(v).toFixed(1)}" x2="${W-padR}" y2="${yAt(v).toFixed(1)}" stroke="var(--paper-2)" stroke-width="1" />
      <text x="${padL-6}" y="${(yAt(v)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--slate)" font-family="IBM Plex Mono, monospace">${Math.round(v)}${o.unit}</text>
    `).join('');

    const firstLabel = points[0].label, lastLabel = points[n-1].label;
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:${H}px; display:block;">
      ${gridHtml}
      ${linesHtml}
      ${dotsHtml}
      <text x="${padL}" y="${H-6}" font-size="9.5" fill="var(--slate)" font-family="IBM Plex Mono, monospace">${firstLabel}</text>
      <text x="${W-padR}" y="${H-6}" text-anchor="end" font-size="9.5" fill="var(--slate)" font-family="IBM Plex Mono, monospace">${lastLabel}</text>
    </svg>`;
  }

  // ---- Agrupación por semana / mes, con desglose por hábito (para los
  // gráficos multi-serie con filtro de hábitos del Dashboard) ----
  function weekNumberOfYear(d) {
    const jan1 = new Date(d.getFullYear(), 0, 1);
    const firstSunday = new Date(jan1); firstSunday.setDate(jan1.getDate() - jan1.getDay());
    const thisSunday = sundayOf(d);
    return Math.round((thisSunday - firstSunday) / (7*86400000)) + 1;
  }
  function weekBucketFn(d) {
    return { key: fmtKey(sundayOf(d)), label: `S${weekNumberOfYear(d)}` };
  }
  function monthBucketFn(d) {
    return { key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, label: MONTHS[d.getMonth()].slice(0,3) };
  }

  function perHabitBuckets(days, bucketFn) {
    const buckets = {};
    const order = [];
    days.forEach(d => {
      if (d > today) return;
      const b = bucketFn(d);
      if (!buckets[b.key]) {
        buckets[b.key] = { label: b.label, perHabit: {} };
        HABITS.forEach(h => { buckets[b.key].perHabit[h.id] = { ok: 0, total: 0 }; });
        order.push(b.key);
      }
      const entry = entries[fmtKey(d)];
      if (!entry) return;
      activeHabitsOn(d).forEach(h => {
        const v = entry[h.id];
        if (v !== undefined && v !== null && v !== '') {
          buckets[b.key].perHabit[h.id].total++;
          if (isCompliant(h, v, d)) buckets[b.key].perHabit[h.id].ok++;
        }
      });
    });
    return order.map(k => ({ key: k, label: buckets[k].label, perHabit: buckets[k].perHabit }));
  }

  function chartLegendHtml(habitsList) {
    return `<div class="chart-legend">${habitsList.map((h, idx) =>
      `<span class="legend-chip"><span class="sw" style="background:${PALETTE[idx % PALETTE.length]}"></span>${h.label}</span>`
    ).join('')}</div>`;
  }

  function xLabelStep(n) { return n <= 16 ? 1 : Math.ceil(n / 16); }

  function multiLineChartSvg(buckets, habitsList) {
    if (buckets.length === 0 || habitsList.length === 0) {
      return `<div class="chart-empty">Sin datos o sin hábitos seleccionados.</div>`;
    }
    const W = 600, H = 210, padL = 34, padR = 12, padT = 14, padB = 30;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const n = buckets.length;
    const xAt = i => n <= 1 ? padL : padL + (i/(n-1)) * innerW;
    const yAt = v => padT + (1 - v/100) * innerH;

    let linesHtml = '';
    habitsList.forEach((h, idx) => {
      const color = PALETTE[idx % PALETTE.length];
      const vals = buckets.map(b => { const s = b.perHabit[h.id]; return s.total > 0 ? Math.round((s.ok/s.total)*100) : null; });
      let segs = [], cur = [];
      vals.forEach((v, i) => {
        if (v === null) { if (cur.length) segs.push(cur); cur = []; }
        else cur.push(`${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`);
      });
      if (cur.length) segs.push(cur);
      segs.forEach(seg => {
        linesHtml += seg.length > 1
          ? `<polyline points="${seg.join(' ')}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />`
          : `<circle cx="${seg[0].split(',')[0]}" cy="${seg[0].split(',')[1]}" r="3" fill="${color}" />`;
      });
    });

    const gridHtml = [0,50,100].map(v => `
      <line x1="${padL}" y1="${yAt(v).toFixed(1)}" x2="${W-padR}" y2="${yAt(v).toFixed(1)}" stroke="var(--paper-2)" stroke-width="1" />
      <text x="${padL-6}" y="${(yAt(v)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--slate)" font-family="IBM Plex Mono, monospace">${v}%</text>
    `).join('');
    const step = xLabelStep(n);
    const xLabelsHtml = buckets.map((b, i) => i % step === 0
      ? `<text x="${xAt(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="8.5" fill="var(--slate)" font-family="IBM Plex Mono, monospace">${b.label}</text>`
      : '').join('');

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:${H}px; display:block;">${gridHtml}${linesHtml}${xLabelsHtml}</svg>${chartLegendHtml(habitsList)}`;
  }

  function multiBarChartSvg(buckets, habitsList) {
    if (buckets.length === 0 || habitsList.length === 0) {
      return `<div class="chart-empty">Sin datos o sin hábitos seleccionados.</div>`;
    }
    const W = 600, H = 210, padL = 34, padR = 12, padT = 14, padB = 30;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const n = buckets.length, g = habitsList.length;
    const groupW = innerW / n;
    const barW = Math.max(1, (groupW * 0.82) / g);
    const yAt = v => padT + (1 - v/100) * innerH;

    let barsHtml = '';
    buckets.forEach((b, i) => {
      const groupX = padL + i*groupW + groupW*0.09;
      habitsList.forEach((h, idx) => {
        const s = b.perHabit[h.id];
        const v = s.total > 0 ? Math.round((s.ok/s.total)*100) : 0;
        const x = groupX + idx*barW;
        const y = yAt(v);
        barsHtml += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(barW*0.86).toFixed(1)}" height="${(padT+innerH-y).toFixed(1)}" fill="${PALETTE[idx % PALETTE.length]}" rx="1.2" />`;
      });
    });

    const gridHtml = [0,50,100].map(v => `
      <line x1="${padL}" y1="${yAt(v).toFixed(1)}" x2="${W-padR}" y2="${yAt(v).toFixed(1)}" stroke="var(--paper-2)" stroke-width="1" />
      <text x="${padL-6}" y="${(yAt(v)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--slate)" font-family="IBM Plex Mono, monospace">${v}%</text>
    `).join('');
    const step = xLabelStep(n);
    const xLabelsHtml = buckets.map((b, i) => i % step === 0
      ? `<text x="${(padL + i*groupW + groupW/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="8.5" fill="var(--slate)" font-family="IBM Plex Mono, monospace">${b.label}</text>`
      : '').join('');

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:${H}px; display:block;">${gridHtml}${barsHtml}${xLabelsHtml}</svg>${chartLegendHtml(habitsList)}`;
  }

  function getPeriodRange(mode, refDate) {
    const ref = refDate || today;
    if (mode === 'week') {
      const start = new Date(ref); start.setDate(start.getDate() - start.getDay());
      const end = new Date(start); end.setDate(end.getDate() + 6);
      return { start, end };
    }
    if (mode === 'month') {
      return { start: new Date(ref.getFullYear(), ref.getMonth(), 1), end: new Date(ref.getFullYear(), ref.getMonth()+1, 0) };
    }
    if (mode === 'quarter') {
      const qIdx = Math.floor(ref.getMonth() / 3);
      return { start: new Date(ref.getFullYear(), qIdx*3, 1), end: new Date(ref.getFullYear(), qIdx*3+3, 0) };
    }
    // year: si es el año en que arrancó el seguimiento, va desde esa fecha
    // hasta fin de ese año; para otros años, el año calendario completo.
    if (ref.getFullYear() === TRACKING_START.getFullYear()) {
      return { start: periodStart(), end: new Date(ref.getFullYear(), 11, 31) };
    }
    return { start: new Date(ref.getFullYear(), 0, 1), end: new Date(ref.getFullYear(), 11, 31) };
  }

  function shiftPeriodRef(mode, dir) {
    const d = new Date(periodRefDate);
    if (mode === 'week') d.setDate(d.getDate() + 7*dir);
    else if (mode === 'month') d.setMonth(d.getMonth() + dir);
    else if (mode === 'quarter') d.setMonth(d.getMonth() + 3*dir);
    else d.setFullYear(d.getFullYear() + dir);
    periodRefDate = d;
  }

  function periodRangeLabel(mode, range) {
    if (mode === 'week') {
      return `${String(range.start.getDate()).padStart(2,'0')} ${MONTHS[range.start.getMonth()].slice(0,3)} — ${String(range.end.getDate()).padStart(2,'0')} ${MONTHS[range.end.getMonth()].slice(0,3)} ${range.end.getFullYear()}`;
    }
    if (mode === 'month') {
      return `${MONTHS[range.start.getMonth()]} ${range.start.getFullYear()}`;
    }
    if (mode === 'quarter') {
      const q = Math.floor(range.start.getMonth()/3) + 1;
      return `T${q} · ${range.start.getFullYear()}`;
    }
    return `${range.start.getFullYear()}`;
  }

  // ---- Objetivos: clave/etiqueta/navegación por tipo de período ----
  function sundayOf(d) {
    const s = new Date(d);
    s.setDate(s.getDate() - s.getDay());
    return s;
  }
  function periodKeyFor(type, d) {
    if (type === 'anual') return `${d.getFullYear()}`;
    if (type === 'trimestral') return `${d.getFullYear()}-Q${Math.floor(d.getMonth()/3)+1}`;
    if (type === 'mensual') return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    return fmtKey(sundayOf(d)); // semanal
  }
  function periodLabelFor(type, d) {
    if (type === 'anual') return `${d.getFullYear()}`;
    if (type === 'trimestral') return `T${Math.floor(d.getMonth()/3)+1} · ${d.getFullYear()}`;
    if (type === 'mensual') return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    const s = sundayOf(d);
    const e = new Date(s); e.setDate(e.getDate()+6);
    return `${String(s.getDate()).padStart(2,'0')} ${MONTHS[s.getMonth()].slice(0,3)} — ${String(e.getDate()).padStart(2,'0')} ${MONTHS[e.getMonth()].slice(0,3)} ${e.getFullYear()}`;
  }
  function shiftGoalsRef(type, dir) {
    const d = new Date(goalsRefDate);
    if (type === 'anual') d.setFullYear(d.getFullYear() + dir);
    else if (type === 'trimestral') d.setMonth(d.getMonth() + 3*dir);
    else if (type === 'mensual') d.setMonth(d.getMonth() + dir);
    else d.setDate(d.getDate() + 7*dir);
    goalsRefDate = d;
  }
  function loadGoalForm() {
    const key = periodKeyFor(objetivosTab, goalsRefDate);
    const g = goals[key] || {};
    goalForm = {
      prof: g.prof !== undefined ? g.prof : '',
      fin: g.fin !== undefined ? g.fin : '',
      salud: g.salud !== undefined ? g.salud : '',
      creci: g.creci !== undefined ? g.creci : '',
    };
  }
  function setGoalField(id, val) { goalForm[id] = val; }
  function escapeHtml(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  async function persistGoal(type, key, f) {
    const payload = {
      key: SECRET_KEY,
      type: 'goal',
      periodo_tipo: type,
      periodo_key: key,
      entry: {
        objetivo_profesional: f.prof || '',
        objetivo_finanzas: f.fin || '',
        objetivo_salud: f.salud || '',
        objetivo_crecimiento: f.creci || '',
      },
    };
    const delays = [400, 900, 1800];
    for (let attempt = 0; attempt <= delays.length; attempt++) {
      try {
        const res = await fetch(WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data && data.ok) return true;
      } catch (e) {
        console.error('goal save error', e);
      }
      if (attempt < delays.length) await new Promise(r => setTimeout(r, delays[attempt]));
    }
    return false;
  }

  async function saveGoal() {
    const type = objetivosTab;
    const key = periodKeyFor(type, goalsRefDate);
    goals[key] = { ...goalForm };
    const ok = await persistGoal(type, key, goalForm);
    goalSaveMsg = ok ? 'Guardado ✓' : 'Falló el guardado — probá de nuevo.';
    render();
    setTimeout(() => { goalSaveMsg = ''; render(); }, 2200);
  }

  function setConfigField(id, val) { configForm[id] = val; }

  async function saveConfig() {
    const todayKey = fmtKey(today);
    const merged = coerceConfig({ ...configForm, effectiveFrom: todayKey });
    // Si ya guardaste config hoy, la reemplaza (no duplica filas por día);
    // si no, agrega una versión nueva que rige desde hoy en adelante —
    // los días anteriores conservan la config que tenían.
    const idx = configHistory.findIndex(c => c.effectiveFrom === todayKey);
    if (idx === -1) configHistory.push(merged); else configHistory[idx] = merged;
    sortConfigHistory();
    CONFIG = configAt(today);
    configForm = { ...merged };
    await saveSnapshotToCache();
    const ok = await persistOrQueue({
      key: SECRET_KEY,
      type: 'config',
      entry: {
        effective_from: todayKey,
        wake_target: merged.wakeTarget,
        sleep_min: merged.sleepMin,
        sleep_max: merged.sleepMax,
        water_min: merged.waterMin,
        daily_goal_pct: merged.dailyGoalPct,
        training_days_goal: merged.trainingDaysPerWeek,
      },
    });
    configSaveMsg = ok ? 'Guardado ✓' : 'Falló el guardado — se reintentará solo cuando haya conexión.';
    render();
    setTimeout(() => { configSaveMsg = ''; render(); }, 2400);
  }

  // Racha individual de un hábito: días consecutivos con estado "ok"
  // (cumplido). Un día "no cumplido" o "pendiente" corta la racha.
  function computeHabitStreak(habit, qStart, lastDay) {
    let streak = 0, running = 0;
    let d = new Date(lastDay);
    let lookback = 0;
    while (lookback < 1000) {
      if (d < habit.activeSince) break;
      const entry = entries[fmtKey(d)];
      const st = entry ? habitStatus(habit, entry[habit.id], d) : 'pending';
      if (st === 'ok') running++; else break;
      d.setDate(d.getDate()-1);
      lookback++;
    }
    streak = running;

    let bestStreak = 0;
    running = 0;
    const start = habit.activeSince > qStart ? habit.activeSince : qStart;
    let d2 = new Date(start);
    while (d2 <= lastDay) {
      const entry = entries[fmtKey(d2)];
      const st = entry ? habitStatus(habit, entry[habit.id], d2) : 'pending';
      if (st === 'ok') { running++; bestStreak = Math.max(bestStreak, running); }
      else running = 0;
      d2.setDate(d2.getDate()+1);
    }
    return { streak, bestStreak };
  }

  function computeStatsForRange(qStart, qEnd) {
    const lastDay = today < qEnd ? today : qEnd;
    const days = [];
    let cursor = new Date(qStart);
    while (cursor <= qEnd) {
      days.push(new Date(cursor));
      cursor.setDate(cursor.getDate()+1);
    }

    let registeredCount = 0;
    let sumPct = 0;
    let perfectDaysCount = 0;
    const perHabit = {};
    HABITS.forEach(h => perHabit[h.id] = { ok: 0, total: 0 });

    // La meta de cumplimiento diario (para la racha) también respeta la
    // configuración vigente en CADA día, no un único valor global.
    const goalFracFor = d => (configAt(d).dailyGoalPct || 80) / 100;
    let streak = 0, bestStreak = 0, running = 0;
    let cur = new Date(lastDay);
    let streaking = true;

    days.forEach(d => {
      const key = fmtKey(d);
      const entry = entries[key];
      const score = dayScore(entry, d);
      if (d <= today && score !== null) {
        registeredCount++;
        sumPct += score;
        if (score === 1) perfectDaysCount++;
        activeHabitsOn(d).forEach(h => {
          const v = entry[h.id];
          if (v !== undefined && v !== null && v !== '') {
            perHabit[h.id].total++;
            if (isCompliant(h, v, d)) perHabit[h.id].ok++;
          }
        });
      }
    });

    // racha actual: días consecutivos hacia atrás desde lastDay con
    // cumplimiento >= meta configurada. Un día sin responder (score null)
    // corta la racha (no cuenta como incumplido, simplemente la corta).
    let d2 = new Date(lastDay);
    let lookback = 0;
    while (lookback < 1000) {
      const key = fmtKey(d2);
      const score = dayScore(entries[key], d2);
      if (score !== null && score >= goalFracFor(d2)) { running++; }
      else { break; }
      d2.setDate(d2.getDate()-1);
      lookback++;
    }
    streak = running;

    // mejor racha >= meta, dentro del período
    running = 0;
    let d3 = new Date(qStart);
    while (d3 <= lastDay) {
      const key = fmtKey(d3);
      const score = dayScore(entries[key], d3);
      if (score !== null && score >= goalFracFor(d3)) { running++; bestStreak = Math.max(bestStreak, running); }
      else { running = 0; }
      d3.setDate(d3.getDate()+1);
    }

    const overall = registeredCount > 0 ? sumPct / registeredCount : 0;

    // monthly breakdown across the period
    const monthlyAgg = {};
    let wakeSum = 0, wakeCount = 0;
    days.forEach(d => {
      if (d > today) return;
      const key = fmtKey(d);
      const entry = entries[key];
      const score = dayScore(entry, d);
      const mKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      if (score !== null) {
        if (!monthlyAgg[mKey]) monthlyAgg[mKey] = { sum: 0, count: 0 };
        monthlyAgg[mKey].sum += score;
        monthlyAgg[mKey].count++;
      }
      if (entry && entry.wake) {
        const parts = entry.wake.split(':');
        const hh = Number(parts[0]), mm = Number(parts[1]);
        if (!isNaN(hh) && !isNaN(mm)) { wakeSum += hh * 60 + mm; wakeCount++; }
      }
    });
    const monthList = [];
    let mCursor = new Date(qStart.getFullYear(), qStart.getMonth(), 1);
    const mEnd = new Date(qEnd.getFullYear(), qEnd.getMonth(), 1);
    while (mCursor <= mEnd) {
      const mKey = `${mCursor.getFullYear()}-${String(mCursor.getMonth()+1).padStart(2,'0')}`;
      const agg = monthlyAgg[mKey];
      monthList.push({
        label: `${MONTHS[mCursor.getMonth()]} ${mCursor.getFullYear()}`,
        pct: agg && agg.count > 0 ? agg.sum / agg.count : null,
        days: agg ? agg.count : 0,
      });
      mCursor.setMonth(mCursor.getMonth() + 1);
    }
    const avgWakeMinutes = wakeCount > 0 ? Math.round(wakeSum / wakeCount) : null;
    const avgWakeLabel = avgWakeMinutes === null ? '—' :
      `${String(Math.floor(avgWakeMinutes/60)).padStart(2,'0')}:${String(avgWakeMinutes%60).padStart(2,'0')}`;

    return { qStart, qEnd, days, registeredCount, overall, perHabit, streak, bestStreak, perfectDaysCount, monthList, avgWakeLabel };
  }

  // Vista anual completa: resumen mensual y mapa de calor siempre cubren
  // todo el período de seguimiento, sin importar el filtro elegido.
  function computeAnnualStats() {
    return computeStatsForRange(periodStart(), periodEnd(today));
  }
  // Vista según el selector Semana/Mes/Trimestre/Año — alimenta el anillo,
  // las tarjetas y las barras por hábito.
  function computePeriodStats(mode) {
    const range = getPeriodRange(mode, periodRefDate);
    const stats = computeStatsForRange(range.start, range.end);
    stats.rangeLabel = periodRangeLabel(mode, range);
    return stats;
  }

  // ---- Comparación con el período anterior (Cambio 6) ----
  const MIN_DAYS_FOR_COMPARISON = 3;
  function getPreviousPeriodRange(mode, refDate) {
    const prevRef = new Date(refDate);
    if (mode === 'week') prevRef.setDate(prevRef.getDate() - 7);
    else if (mode === 'month') prevRef.setMonth(prevRef.getMonth() - 1);
    else if (mode === 'quarter') prevRef.setMonth(prevRef.getMonth() - 3);
    else prevRef.setFullYear(prevRef.getFullYear() - 1);
    return getPeriodRange(mode, prevRef);
  }
  function computeComparison(mode) {
    const currRange = getPeriodRange(mode, periodRefDate);
    const curr = computeStatsForRange(currRange.start, currRange.end);
    const prevRange = getPreviousPeriodRange(mode, periodRefDate);
    const prev = computeStatsForRange(prevRange.start, prevRange.end);
    if (prev.registeredCount < MIN_DAYS_FOR_COMPARISON) return null; // período anterior sin datos suficientes
    const currPct = Math.round(curr.overall * 100);
    const prevPct = Math.round(prev.overall * 100);
    return { currPct, prevPct, diffPp: currPct - prevPct, prevLabel: periodRangeLabel(mode, prevRange) };
  }

  // ---- Fortalezas y a mejorar (Cambio 7) ----
  const MIN_DAYS_FOR_STRENGTHS = 5;
  function strengthsAndWeaknesses(perHabit) {
    const rows = HABITS
      .map(h => {
        const s = perHabit[h.id];
        if (!s || s.total < MIN_DAYS_FOR_STRENGTHS) return null;
        return { habit: h, pct: Math.round((s.ok / s.total) * 100), total: s.total };
      })
      .filter(Boolean)
      .sort((a, b) => b.pct - a.pct);
    const strengths = rows.slice(0, 3);
    const weaknesses = rows.slice(-3).reverse().filter(r => !strengths.includes(r));
    return { strengths, weaknesses };
  }

  // ---- Cumplimiento por día de semana (Cambio 8) ----
  const MIN_WEEKS_FOR_WEEKDAY_CALLOUT = 2;
  function weekdayStats(days) {
    const agg = [0,1,2,3,4,5,6].map(() => ({ sum: 0, count: 0 }));
    days.forEach(d => {
      if (d > today) return;
      const score = dayScore(entries[fmtKey(d)], d);
      if (score === null) return;
      agg[d.getDay()].sum += score;
      agg[d.getDay()].count++;
    });
    // reordenamos para que arranque el lunes (más natural para leer la semana)
    const order = [1,2,3,4,5,6,0];
    return order.map(wd => ({
      wd, label: WEEKDAYS[wd],
      pct: agg[wd].count > 0 ? Math.round((agg[wd].sum / agg[wd].count) * 100) : null,
      count: agg[wd].count,
    }));
  }

  // ---- Mapa de calor anual (Cambio 9) ----
  function heatBucketColor(pct) {
    if (pct === null) return 'var(--paper-2)';       // sin registro
    if (pct < 0.5) return '#F3E0C9';                  // 0–49% bajo
    if (pct < 0.7) return '#EABF86';                  // 50–69% medio-bajo
    if (pct < 0.8) return '#E8A33D';                  // 70–79% medio
    if (pct < 1) return '#D6821F';                    // 80–99% alto
    return '#8C4A1B';                                 // 100% perfecto
  }
  function heatBucketLabel(pct) {
    if (pct === null) return 'sin registro';
    if (pct < 0.5) return 'bajo';
    if (pct < 0.7) return 'medio-bajo';
    if (pct < 0.8) return 'medio';
    if (pct < 1) return 'alto';
    return 'perfecto';
  }

  // ---- Dashboard Salud (Cambio 11) ----
  const SALUD_METRICS = [
    { id: 'weight', label: 'Peso', min: 40, max: 150, unit: 'kg' },
    { id: 'waist', label: 'Cintura', min: 40, max: 150, unit: 'cm' },
    { id: 'sleep', label: 'Sueño (horas)', min: 0, max: 12, unit: 'h' },
    { id: 'sleep_score', label: 'Sleep score', min: 0, max: 100, unit: 'pts' },
    { id: 'sleep_deep', label: 'Sueño profundo', min: 0, max: 300, unit: 'min' },
    { id: 'sleep_rem', label: 'REM', min: 0, max: 200, unit: 'min' },
    { id: 'resting_hr', label: 'FC en reposo', min: 40, max: 100, unit: 'bpm' },
    { id: 'body_battery', label: 'Body battery', min: 0, max: 100, unit: 'pts' },
    { id: 'stress', label: 'Estrés', min: 0, max: 100, unit: 'pts' },
    { id: 'training_steps', label: 'Pasos', min: 0, max: 20000, unit: '' },
    { id: 'training_vo2max', label: 'VO₂ Max', min: 0, max: 90, unit: '' },
    { id: 'training_duration', label: 'Min. entrenamiento', min: 0, max: 300, unit: 'min' },
    { id: 'training_distance', label: 'Distancia', min: 0, max: 50, unit: 'km' },
  ];

  function computeSaludStats(rangeStart, rangeEnd) {
    const days = [];
    let cursor = new Date(rangeStart);
    while (cursor <= rangeEnd) { days.push(new Date(cursor)); cursor.setDate(cursor.getDate()+1); }
    const eligible = days.filter(d => d <= today);

    let sleepHSum=0, sleepHCount=0, scoreSum=0, scoreCount=0, deepSum=0, deepCount=0, remSum=0, remCount=0;
    let rhrSum=0, rhrCount=0, bbSum=0, bbCount=0, stressSum=0, stressCount=0;
    let trainCount=0, trainMinSum=0, trainKmSum=0;
    const periodWeights = [];

    eligible.forEach(d => {
      const e = entries[fmtKey(d)];
      if (!e) return;
      if (e.weight !== undefined && e.weight !== '' && e.weight !== null) periodWeights.push(Number(e.weight));
      if (e.sleep !== undefined && e.sleep !== '') { sleepHSum += Number(e.sleep); sleepHCount++; }
      if (e.sleep_score !== undefined && e.sleep_score !== '') { scoreSum += Number(e.sleep_score); scoreCount++; }
      if (e.sleep_deep !== undefined && e.sleep_deep !== '') { deepSum += Number(e.sleep_deep); deepCount++; }
      if (e.sleep_rem !== undefined && e.sleep_rem !== '') { remSum += Number(e.sleep_rem); remCount++; }
      if (e.resting_hr !== undefined && e.resting_hr !== '') { rhrSum += Number(e.resting_hr); rhrCount++; }
      if (e.body_battery !== undefined && e.body_battery !== '') { bbSum += Number(e.body_battery); bbCount++; }
      if (e.stress !== undefined && e.stress !== '') { stressSum += Number(e.stress); stressCount++; }
      if (e.training_done === true) {
        trainCount++;
        if (e.training_duration !== undefined && e.training_duration !== '') trainMinSum += Number(e.training_duration);
        if (e.training_distance !== undefined && e.training_distance !== '') trainKmSum += Number(e.training_distance);
      }
    });

    // Serie completa de peso desde el arranque del seguimiento (para el
    // "cambio desde el primer registro", que no depende del período elegido).
    const allWeights = [];
    let wd = new Date(periodStart());
    while (wd <= today) {
      const e = entries[fmtKey(wd)];
      if (e && e.weight !== undefined && e.weight !== '' && e.weight !== null) allWeights.push(Number(e.weight));
      wd.setDate(wd.getDate()+1);
    }
    const avg = (s,c) => c > 0 ? Math.round((s/c)*10)/10 : null;
    const round1 = v => Math.round(v*10)/10;

    return {
      weightCurrent: allWeights.length ? allWeights[allWeights.length-1] : null,
      weightChangeSinceFirst: allWeights.length >= 2 ? round1(allWeights[allWeights.length-1] - allWeights[0]) : null,
      weightChangeInPeriod: periodWeights.length >= 2 ? round1(periodWeights[periodWeights.length-1] - periodWeights[0]) : null,
      sleepHoursAvg: avg(sleepHSum, sleepHCount),
      sleepScoreAvg: avg(scoreSum, scoreCount),
      sleepDeepAvg: avg(deepSum, deepCount),
      sleepRemAvg: avg(remSum, remCount),
      rhrAvg: avg(rhrSum, rhrCount),
      bbAvg: avg(bbSum, bbCount),
      stressAvg: avg(stressSum, stressCount),
      trainCount,
      trainMinSum: Math.round(trainMinSum),
      trainKmSum: round1(trainKmSum),
      trainAvgDuration: trainCount > 0 ? Math.round(trainMinSum / trainCount) : null,
    };
  }

  // ---- Insights y correlaciones (Cambio 12) — sin APIs externas, sin IA,
  // solo estadística descriptiva sobre los propios datos. No afirma
  // causalidad; exige un mínimo de muestra por grupo. ----
  const INSIGHT_MIN_N = 7;
  function computeInsights(days) {
    const insights = [];
    const avg = arr => arr.reduce((a,b) => a+b, 0) / arr.length;
    const eligible = days.filter(d => d <= today);

    // 1) Sueño y hábitos
    {
      const hi = [], lo = [];
      eligible.forEach(d => {
        const e = entries[fmtKey(d)];
        if (!e || e.sleep === undefined || e.sleep === '') return;
        const score = dayScore(e, d);
        if (score === null) return;
        (Number(e.sleep) >= 7 ? hi : lo).push(score * 100);
      });
      if (hi.length >= INSIGHT_MIN_N && lo.length >= INSIGHT_MIN_N) {
        insights.push({ title: 'Sueño y hábitos',
          text: `los días con ≥7 h de sueño tienen un cumplimiento promedio de <b>${Math.round(avg(hi))}%</b> (n=${hi.length}), contra <b>${Math.round(avg(lo))}%</b> en días con menos sueño (n=${lo.length})` });
      }
    }
    // 2) Body Battery y entrenamiento
    {
      const hi = [], lo = [];
      eligible.forEach(d => {
        const e = entries[fmtKey(d)];
        if (!e || e.body_battery === undefined || e.body_battery === '') return;
        const bb = Number(e.body_battery);
        const trained = e.training_done === true ? 100 : 0;
        if (bb >= 70) hi.push(trained); else if (bb < 40) lo.push(trained);
      });
      if (hi.length >= INSIGHT_MIN_N && lo.length >= INSIGHT_MIN_N) {
        insights.push({ title: 'Body Battery y entrenamiento',
          text: `en días con Body Battery ≥70 entrenaste el <b>${Math.round(avg(hi))}%</b> de las veces (n=${hi.length}), contra <b>${Math.round(avg(lo))}%</b> con Body Battery <40 (n=${lo.length})` });
      }
    }
    // 3) Estrés y cumplimiento
    {
      const hi = [], lo = [];
      eligible.forEach(d => {
        const e = entries[fmtKey(d)];
        if (!e || e.stress === undefined || e.stress === '') return;
        const score = dayScore(e, d);
        if (score === null) return;
        const st = Number(e.stress);
        if (st >= 60) hi.push(score * 100); else if (st < 40) lo.push(score * 100);
      });
      if (hi.length >= INSIGHT_MIN_N && lo.length >= INSIGHT_MIN_N) {
        insights.push({ title: 'Estrés y cumplimiento',
          text: `en días con estrés ≥60 el cumplimiento promedio fue <b>${Math.round(avg(hi))}%</b> (n=${hi.length}), contra <b>${Math.round(avg(lo))}%</b> en días con estrés <40 (n=${lo.length})` });
      }
    }
    // 4) Sueño y entrenamiento
    {
      const hi = [], lo = [];
      eligible.forEach(d => {
        const e = entries[fmtKey(d)];
        if (!e || e.sleep === undefined || e.sleep === '') return;
        const trained = e.training_done === true ? 100 : 0;
        (Number(e.sleep) >= 7 ? hi : lo).push(trained);
      });
      if (hi.length >= INSIGHT_MIN_N && lo.length >= INSIGHT_MIN_N) {
        insights.push({ title: 'Sueño y entrenamiento',
          text: `en días con ≥7 h de sueño entrenaste el <b>${Math.round(avg(hi))}%</b> de las veces (n=${hi.length}), contra <b>${Math.round(avg(lo))}%</b> con menos sueño (n=${lo.length})` });
      }
    }

    return insights.slice(0, 5); // máximo 5, como pide el cambio 20/12
  }

  function countProgress(list) {
    let compliant = 0, notCompliant = 0, pending = 0;
    list.forEach(h => {
      const st = habitStatus(h, form[h.id], selectedDate);
      if (st === 'ok') compliant++;
      else if (st === 'no') notCompliant++;
      else pending++;
    });
    return { filled: compliant + notCompliant, compliant, notCompliant, pending, total: list.length };
  }

  // Badge de progreso: "N/T cumplidos" + desglose no cumplido/pendiente,
  // distinguiendo siempre "sin responder" de "no cumplido".
  function progressBadgeHtml(p) {
    const bits = [];
    if (p.notCompliant > 0) bits.push(`${p.notCompliant} no cumplido${p.notCompliant===1?'':'s'}`);
    if (p.pending > 0) bits.push(`${p.pending} pendiente${p.pending===1?'':'s'}`);
    const tail = bits.length ? ` · ${bits.join(' · ')}` : '';
    return `<b>${p.compliant}/${p.total}</b> cumplidos${tail}`;
  }

      if (dashboardTab === 'habitos') {
        const annual = computeAnnualStats();
        const overallPct = Math.round(period.overall * 100);
        const ringBg = `conic-gradient(var(--sunrise) ${overallPct}%, var(--paper-2) ${overallPct}% 100%)`;
        const lastDayForStreak = today < period.qEnd ? today : period.qEnd;
        const barsHtml = HABITS.map(h => {
          const s = period.perHabit[h.id];
          const pct = s.total > 0 ? Math.round((s.ok / s.total) * 100) : 0;
          const hs = computeHabitStreak(h, period.qStart, lastDayForStreak);
          return `<div class="bar-item">
            <div class="bar-row">
              <div class="bar-label">${h.label}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${s.total>0?pct:0}%"></div></div>
              <div class="bar-pct">${s.total>0 ? pct+'%' : '—'}</div>
            </div>
            <div class="bar-streak">racha ${hs.streak} · mejor racha ${hs.bestStreak}</div>
          </div>`;
        }).join('');
        const monthlyHtml = annual.monthList.map(m => {
          const pct = m.pct === null ? null : Math.round(m.pct * 100);
          return `<div class="bar-item">
            <div class="bar-row">
              <div class="bar-label" style="text-transform:capitalize;">${m.label}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct||0}%"></div></div>
              <div class="bar-pct">${pct===null ? '—' : pct+'%'}</div>
            </div>
          </div>`;
        }).join('');
        const compliancePoints = period.days.filter(d => d <= today).map(d => {
          const s = dayScore(entries[fmtKey(d)], d);
          return { label: `${d.getDate()}/${d.getMonth()+1}`, value: s === null ? null : Math.round(s*100) };
        });

        // Cambio 6 — comparación con el período anterior
        const cmp = computeComparison(periodMode);
        const cmpHtml = cmp ? `
          <div class="bars-card">
            <div class="section-title" style="margin:2px 0 10px;">Comparación con el período anterior</div>
            <div class="cmp-row">
              <div class="cmp-block"><div class="cmp-pct dim">${cmp.prevPct}%</div><div class="cmp-lbl">${cmp.prevLabel}</div></div>
              <div class="cmp-arrow ${cmp.diffPp>0?'up':cmp.diffPp<0?'down':'flat'}">${cmp.diffPp>0?'▲':cmp.diffPp<0?'▼':'—'} ${cmp.diffPp>0?'+':''}${cmp.diffPp} pp</div>
              <div class="cmp-block"><div class="cmp-pct">${cmp.currPct}%</div><div class="cmp-lbl">${PERIODS.find(p=>p.id===periodMode).label}</div></div>
            </div>
          </div>` : `
          <div class="bars-card">
            <div class="section-title" style="margin:2px 0 10px;">Comparación con el período anterior</div>
            <div class="chart-empty">El período anterior todavía no tiene suficientes registros para comparar.</div>
          </div>`;

        // Cambio 7 — fortalezas y a mejorar
        const sw = strengthsAndWeaknesses(period.perHabit);
        const swHtml = (sw.strengths.length === 0 && sw.weaknesses.length === 0) ? `
          <div class="bars-card">
            <div class="section-title" style="margin:2px 0 10px;">Fortalezas y a mejorar</div>
            <div class="chart-empty">Necesitás al menos ${MIN_DAYS_FOR_STRENGTHS} días registrados por hábito para ver esto.</div>
          </div>` : `
          <div class="bars-card">
            <div class="section-title" style="margin:2px 0 10px;">Fortalezas y a mejorar</div>
            <div class="sw-grid">
              <div>
                <div class="sw-col-title">Fortalezas</div>
                ${sw.strengths.map(r => `<div class="sw-item"><span>${r.habit.label}</span><span class="sw-pct" style="color:#2E7D4F;">${r.pct}%</span></div>`).join('') || '<div class="sw-item">—</div>'}
              </div>
              <div>
                <div class="sw-col-title">A mejorar</div>
                ${sw.weaknesses.map(r => `<div class="sw-item"><span>${r.habit.label}</span><span class="sw-pct" style="color:var(--clay);">${r.pct}%</span></div>`).join('') || '<div class="sw-item">—</div>'}
              </div>
            </div>
          </div>`;

        // Cambio 8 — cumplimiento por día de la semana (considera todo el período de seguimiento)
        const wdStats = weekdayStats(annual.days);
        const wdWithData = wdStats.filter(w => w.count >= MIN_WEEKS_FOR_WEEKDAY_CALLOUT);
        const wdBest = wdWithData.length ? wdWithData.reduce((a,b) => b.pct > a.pct ? b : a) : null;
        const wdWorst = wdWithData.length ? wdWithData.reduce((a,b) => b.pct < a.pct ? b : a) : null;
        const weekdayHtml = `
          <div class="bars-card">
            <div class="section-title" style="margin:2px 0 10px;">Cumplimiento por día de la semana</div>
            ${wdStats.map(w => `
              <div class="weekday-row">
                <div class="weekday-label">${w.label.slice(0,3)}</div>
                <div class="bar-track"><div class="bar-fill" style="width:${w.pct||0}%"></div></div>
                <div class="bar-pct">${w.pct===null?'—':w.pct+'%'}</div>
              </div>`).join('')}
            ${wdBest && wdWorst ? `
              <div class="weekday-callout">
                <b>Mejor día:</b> ${wdBest.label} · ${wdBest.pct}%<br/>
                <b>Día más débil:</b> ${wdWorst.label} · ${wdWorst.pct}%
              </div>` : `<div class="weekday-callout">Todavía no hay suficientes semanas registradas para identificar un patrón.</div>`}
          </div>`;

        // Cambio 9 — mapa de calor anual, estilo GitHub adaptado a la identidad de la app
        const heatCellsHtml = annual.days.map(d => {
          const isFuture = d > today;
          const key = fmtKey(d);
          const label = `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
          if (isFuture) return `<div class="heat-cell future" title=""></div>`;
          const score = dayScore(entries[key], d);
          const brk = dayBreakdown(entries[key], d);
          const color = heatBucketColor(score);
          const tipText = score === null
            ? `${label} · sin registro`
            : `${label} · ${Math.round(score*100)}% · ${brk.compliant} cumplidos · ${brk.notCompliant} no cumplidos · ${brk.pending} pendientes`;
          return `<div class="heat-cell" style="background:${color}"><div class="tip">${tipText}</div></div>`;
        }).join('');
        const heatmapHtml = `
          <div class="heat-card">
            <div class="heat-head">
              <h2>Mapa de calor anual</h2>
              <div class="range">${String(annual.qStart.getDate()).padStart(2,'0')}/${annual.qStart.getMonth()+1} — ${String(annual.qEnd.getDate()).padStart(2,'0')}/${annual.qEnd.getMonth()+1}</div>
            </div>
            <div class="heat-grid">${heatCellsHtml}</div>
            <div class="heat-legend">
              <span>menos</span>
              <span class="sw" style="background:${heatBucketColor(null)}"></span>
              <span class="sw" style="background:${heatBucketColor(0.3)}"></span>
              <span class="sw" style="background:${heatBucketColor(0.6)}"></span>
              <span class="sw" style="background:${heatBucketColor(0.75)}"></span>
              <span class="sw" style="background:${heatBucketColor(0.9)}"></span>
              <span class="sw" style="background:${heatBucketColor(1)}"></span>
              <span>más</span>
            </div>
          </div>`;

        sectionHtml = `
          <div class="dash-top" style="margin-top:10px;">
            <div class="ring-card">
              <div class="ring" style="background:${ringBg}">
                <div class="ring-inner">
                  <div class="pct">${overallPct}%</div>
                  <div class="lbl">cumpl.</div>
                </div>
              </div>
              <div class="ring-caption">Promedio · ${PERIODS.find(p=>p.id===periodMode).label.toLowerCase()}</div>
            </div>
            <div class="stat-stack">
              <div class="stat-box"><div class="num">${period.registeredCount}</div><div class="lbl">días registrados</div></div>
              <div class="stat-box"><div class="num mono" style="font-size:20px;">${period.avgWakeLabel}</div><div class="lbl">hora promedio de levantada</div></div>
              <div class="stat-box"><div class="num">🔥 ${annual.streak}</div><div class="lbl">racha actual (≥${CONFIG.dailyGoalPct}%)</div></div>
              <div class="stat-box"><div class="num">${annual.bestStreak}</div><div class="lbl">mejor racha del período (≥${CONFIG.dailyGoalPct}%)</div></div>
              <div class="stat-box"><div class="num">${annual.perfectDaysCount}</div><div class="lbl">días perfectos (100%)</div></div>
            </div>
          </div>
          ${cmpHtml}
          <div class="bars-card">
            <div class="section-title" style="margin:2px 0 4px;">Cumplimiento por hábito</div>
            ${barsHtml}
          </div>
          ${swHtml}
          ${weekdayHtml}
          <div class="bars-card">
            <div class="section-title" style="margin:2px 0 10px;">Cumplimiento en el período</div>
            ${lineChartSvg(compliancePoints, { min: 0, max: 100, unit: '%', color: 'var(--sunrise-deep)' })}
          </div>
          <div class="bars-card">
            <div class="section-title" style="margin:2px 0 4px;">Cumplimiento mensual</div>
            ${monthlyHtml}
          </div>
          <div class="bars-card">
            <div class="section-title" style="margin:2px 0 10px;">Cumplimiento por hábito — evolución</div>
            <div class="chip-row">
              <button class="chip ${chartHabitIds.length===HABITS.length?'active':''}" data-action="chartall">Todos</button>
              ${HABITS.map((h,i) => `<button class="chip ${chartHabitIds.includes(h.id)?'active':''}" data-action="charthabit" data-id="${h.id}" style="${chartHabitIds.includes(h.id)?`background:${PALETTE[i%PALETTE.length]};border-color:${PALETTE[i%PALETTE.length]};color:#fff;`:''}">${h.label}</button>`).join('')}
            </div>
            <div class="tab-bar" style="padding-top:10px; padding-bottom:0;">
              <button class="tab-btn ${chartType==='line'?'active':''}" data-action="charttype" data-val="line">Líneas</button>
              <button class="tab-btn ${chartType==='bar'?'active':''}" data-action="charttype" data-val="bar">Columnas</button>
            </div>
          </div>
          <div class="bars-card">
            <div class="section-title" style="margin:2px 0 10px;">Por semana</div>
            ${chartType==='line' ? multiLineChartSvg(perHabitBuckets(annual.days, weekBucketFn), HABITS.filter(h=>chartHabitIds.includes(h.id))) : multiBarChartSvg(perHabitBuckets(annual.days, weekBucketFn), HABITS.filter(h=>chartHabitIds.includes(h.id)))}
          </div>
          <div class="bars-card">
            <div class="section-title" style="margin:2px 0 10px;">Por mes</div>
            ${chartType==='line' ? multiLineChartSvg(perHabitBuckets(annual.days, monthBucketFn), HABITS.filter(h=>chartHabitIds.includes(h.id))) : multiBarChartSvg(perHabitBuckets(annual.days, monthBucketFn), HABITS.filter(h=>chartHabitIds.includes(h.id)))}
          </div>
          ${heatmapHtml}`;
      } else if (dashboardTab === 'salud') {
        const saludStats = computeSaludStats(period.qStart, period.qEnd);
        const fmtN = (v, unit) => v === null ? '—' : `${v}${unit || ''}`;
        const fmtSigned = (v, unit) => v === null ? '—' : `${v > 0 ? '+' : ''}${v}${unit || ''}`;

        const statsHtml = `
          <div class="bars-card">
            <div class="section-title" style="margin:2px 0 10px;">Peso</div>
            <div class="mini-row"><span class="mini-label">Actual</span><span class="mini-value mono">${fmtN(saludStats.weightCurrent, ' kg')}</span></div>
            <div class="mini-row"><span class="mini-label">Cambio en el período</span><span class="mini-value mono">${fmtSigned(saludStats.weightChangeInPeriod, ' kg')}</span></div>
            <div class="mini-row"><span class="mini-label">Cambio desde el primer registro</span><span class="mini-value mono">${fmtSigned(saludStats.weightChangeSinceFirst, ' kg')}</span></div>
          </div>
          <div class="bars-card">
            <div class="section-title" style="margin:2px 0 10px;">Sueño</div>
            <div class="mini-row"><span class="mini-label">Promedio horas</span><span class="mini-value mono">${fmtN(saludStats.sleepHoursAvg, ' h')}</span></div>
            <div class="mini-row"><span class="mini-label">Promedio sleep score</span><span class="mini-value mono">${fmtN(saludStats.sleepScoreAvg, ' pts')}</span></div>
            <div class="mini-row"><span class="mini-label">Promedio sueño profundo</span><span class="mini-value mono">${fmtN(saludStats.sleepDeepAvg, ' min')}</span></div>
            <div class="mini-row"><span class="mini-label">Promedio REM</span><span class="mini-value mono">${fmtN(saludStats.sleepRemAvg, ' min')}</span></div>
          </div>
          <div class="bars-card">
            <div class="section-title" style="margin:2px 0 10px;">Recuperación</div>
            <div class="mini-row"><span class="mini-label">FC reposo promedio</span><span class="mini-value mono">${fmtN(saludStats.rhrAvg, ' bpm')}</span></div>
            <div class="mini-row"><span class="mini-label">Body Battery promedio</span><span class="mini-value mono">${fmtN(saludStats.bbAvg, ' pts')}</span></div>
            <div class="mini-row"><span class="mini-label">Estrés promedio</span><span class="mini-value mono">${fmtN(saludStats.stressAvg, ' pts')}</span></div>
          </div>
          <div class="bars-card">
            <div class="section-title" style="margin:2px 0 10px;">Entrenamiento</div>
            <div class="mini-row"><span class="mini-label">Número de entrenamientos</span><span class="mini-value mono">${saludStats.trainCount}</span></div>
            <div class="mini-row"><span class="mini-label">Minutos acumulados</span><span class="mini-value mono">${saludStats.trainMinSum}</span></div>
            <div class="mini-row"><span class="mini-label">Kilómetros acumulados</span><span class="mini-value mono">${saludStats.trainKmSum}</span></div>
            <div class="mini-row"><span class="mini-label">Promedio duración</span><span class="mini-value mono">${fmtN(saludStats.trainAvgDuration, ' min')}</span></div>
          </div>`;

        const metric = SALUD_METRICS.find(m => m.id === saludMetric) || SALUD_METRICS[0];
        const evoPoints = period.days.filter(d => d <= today).map(d => {
          const e = entries[fmtKey(d)];
          const raw = e ? e[metric.id] : undefined;
          const v = (raw !== undefined && raw !== null && raw !== '') ? Number(raw) : null;
          return { label: `${d.getDate()}/${d.getMonth()+1}`, value: v };
        });
        const evoHtml = `
          <div class="bars-card">
            <div class="section-title" style="margin:2px 0 10px;">Evolución</div>
            <div class="chip-row">
              ${SALUD_METRICS.map(m => `<button class="chip ${saludMetric===m.id?'active':''}" data-action="saludmetric" data-id="${m.id}">${m.label}</button>`).join('')}
            </div>
            <div style="margin-top:12px;">${lineChartSvg(evoPoints, { min: metric.min, max: metric.max, unit: metric.unit, color: 'var(--clay)' })}</div>
          </div>`;

        sectionHtml = statsHtml + evoHtml;
      } else {
        // Insights (Cambio 12) — usa todo el historial disponible, no el
        // período elegido, para tener la mayor muestra posible.
        const annual = computeAnnualStats();
        const insights = computeInsights(annual.days);
        sectionHtml = (insights.length ? insights.map(ins => `
          <div class="bars-card">
            <div class="section-title" style="margin:2px 0 8px;">${ins.title}</div>
            <div style="font-size:13px; line-height:1.65; color:var(--ink);">En tus registros, ${ins.text}.</div>
          </div>`).join('') : `
          <div class="bars-card">
            <div class="chart-empty">Todavía no hay suficientes días registrados (mínimo 7 por grupo) para mostrar asociaciones confiables. Van a ir apareciendo a medida que sigas cargando datos.</div>
          </div>`)
          + `<div style="padding:12px 4px 4px; font-size:11px; color:var(--slate); text-align:center; line-height:1.5;">Estas son asociaciones observadas en tus propios datos, no relaciones de causa-efecto.</div>`;
      }

      bodyHtml = `<div class="tab-bar">${dashTabBarHtml}</div>${dashboardTab !== 'insights' ? `<div class="tab-bar" style="padding-top:0;">${periodPillsHtml}</div>${periodNavHtml}` : ''}${sectionHtml}`;

    } else if (currentCategory === 'objetivos') {
      const tabBarHtml = OBJ_TABS.map(t => tabBtn(t, objetivosTab, 'objtab')).join('');
      const label = periodLabelFor(objetivosTab, goalsRefDate);
      const navHtml = `
        <div class="period-nav">
          <button class="nav-btn small" data-action="goalsprev" aria-label="Período anterior">&#8592;</button>
          <div class="period-label mono">${label}</div>
          <button class="nav-btn small" data-action="goalsnext" aria-label="Período siguiente">&#8594;</button>
        </div>`;
      const cadenceHint = {
        anual: 'Una vez al año, por pilar.',
        trimestral: 'Al inicio de cada trimestre, en tu revisión trimestral.',
        mensual: 'En tu revisión mensual.',
        semanal: 'En tu revisión semanal de los domingos.',
      }[objetivosTab];
      const pillarRowsHtml = PILLARS.map(p => `
        <div class="goal-row">
          <div class="label">${p.label}</div>
          <textarea class="goal-textarea" rows="3" placeholder="Objetivo de ${p.label.toLowerCase()}" data-action="goalfield" data-id="${p.id}">${escapeHtml(goalForm[p.id])}</textarea>
        </div>`).join('');
      const objCard = cardHtml(`Objetivos · ${OBJ_TABS.find(t=>t.id===objetivosTab).label}`, cadenceHint,
        pillarRowsHtml + `
        <div class="save-bar"><button class="save-btn" data-action="savegoal">Guardar objetivos</button></div>
        <div style="padding:0 20px 16px;"><span class="save-msg">${goalSaveMsg}</span></div>`);
      bodyHtml = `<div class="tab-bar">${tabBarHtml}</div>${navHtml}${objCard}`;

    } else if (currentCategory === 'config') {
      const rows = [
        { id: 'wakeTarget', label: 'Hora objetivo de levantada', type: 'time' },
        { id: 'sleepMin', label: 'Sueño mínimo (horas)', type: 'number', step: '0.5', min: '0', max: '14' },
        { id: 'sleepMax', label: 'Sueño máximo (horas)', type: 'number', step: '0.5', min: '0', max: '14' },
        { id: 'waterMin', label: 'Agua mínima (litros)', type: 'number', step: '0.25', min: '0', max: '10' },
        { id: 'dailyGoalPct', label: 'Meta de cumplimiento diario (%)', type: 'number', step: '1', min: '0', max: '100' },
        { id: 'trainingDaysPerWeek', label: 'Días objetivo de entrenamiento por semana', type: 'number', step: '1', min: '0', max: '7' },
      ];
      const rowsHtml = rows.map(r => `
        <div class="goal-row">
          <div class="label">${r.label}</div>
          <input class="num-input" style="width:100%;" type="${r.type}" ${r.step ? `step="${r.step}"` : ''} ${r.min !== undefined ? `min="${r.min}"` : ''} ${r.max !== undefined ? `max="${r.max}"` : ''} value="${configForm[r.id]}" data-action="configfield" data-id="${r.id}" />
        </div>`).join('');
      const configCard = cardHtml('Configuración', 'valores usados en todos los cálculos', rowsHtml + `
        <div class="save-bar"><button class="save-btn" data-action="saveconfig">Guardar configuración</button></div>
        <div style="padding:0 20px 4px;"><span class="save-msg">${configSaveMsg}</span></div>
        <div style="padding:4px 20px 18px; font-size:11.5px; color:var(--slate); line-height:1.5;">Cada vez que guardás, se agrega una versión nueva que rige desde hoy en adelante — los días anteriores conservan la configuración que tenían en su momento, así que cambiar una meta no te reescribe el % histórico.</div>`);

      const historyRows = [...configHistory].reverse();
      const historyCard = cardHtml('Historial de configuración', `${historyRows.length} versión${historyRows.length===1?'':'es'}`,
        historyRows.length === 0 ? `<div class="chart-empty">Todavía no guardaste ninguna configuración.</div>` :
        historyRows.map(c => `
          <div class="mini-row">
            <span class="mini-label mono">desde ${c.effectiveFrom}</span>
            <span class="mini-value" style="text-align:right; font-size:11.5px;">${c.wakeTarget} · sueño ${c.sleepMin}-${c.sleepMax}h · agua ${c.waterMin}L · meta ${c.dailyGoalPct}%</span>
          </div>`).join(''));

      bodyHtml = configCard + historyCard;

    } else {
      const cat = CATEGORIES.find(c => c.id === currentCategory);
      bodyHtml = `
        <div class="soon-card">
          <h2 style="font-family:'Fraunces',serif; font-size:17px; margin:0 0 6px;">${cat.label} — próximamente</h2>
          <p style="font-size:13px; color:var(--slate); margin:0;">Esta sección todavía no está construida. Va a sumarse siguiendo el roadmap del proyecto.</p>
        </div>`;
    }

    wrap.innerHTML = `
      ${sideRailHtml}
      <div class="main-col">
        <div class="content-max">
          ${heroHtml}
          ${bodyHtml}
          <div class="footnote">Tus registros se guardan de forma privada en tu Google Sheet.<br/>Podés volver cualquier día y seguir completando desde donde quedaste.</div>
        </div>
      </div>
    `;

    wrap.querySelectorAll('[data-action="category"]').forEach(el => {
      el.addEventListener('click', () => {
        currentCategory = el.dataset.cat;
        if (currentCategory === 'habitos' || currentCategory === 'salud') currentTab = 'manana';
        if (currentCategory === 'objetivos') loadGoalForm();
        render();
      });
    });
    wrap.querySelectorAll('[data-action="tab"]').forEach(el => {
      el.addEventListener('click', () => { currentTab = el.dataset.val; render(); });
    });
    wrap.querySelectorAll('[data-action="dashtab"]').forEach(el => {
      el.addEventListener('click', () => { dashboardTab = el.dataset.val; render(); });
    });
    wrap.querySelectorAll('[data-action="period"]').forEach(el => {
      el.addEventListener('click', () => { periodMode = el.dataset.period; periodRefDate = new Date(today); render(); });
    });
    const periodPrevBtn = wrap.querySelector('[data-action="periodprev"]');
    if (periodPrevBtn) periodPrevBtn.addEventListener('click', () => { shiftPeriodRef(periodMode, -1); render(); });
    const periodNextBtn = wrap.querySelector('[data-action="periodnext"]');
    if (periodNextBtn) periodNextBtn.addEventListener('click', () => { shiftPeriodRef(periodMode, 1); render(); });
    wrap.querySelectorAll('[data-action="objtab"]').forEach(el => {
      el.addEventListener('click', () => { objetivosTab = el.dataset.val; loadGoalForm(); render(); });
    });
    wrap.querySelectorAll('[data-action="charthabit"]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.id;
        chartHabitIds = chartHabitIds.includes(id) ? chartHabitIds.filter(x => x !== id) : [...chartHabitIds, id];
        render();
      });
    });
    const chartAllBtn = wrap.querySelector('[data-action="chartall"]');
    if (chartAllBtn) chartAllBtn.addEventListener('click', () => {
      chartHabitIds = chartHabitIds.length === HABITS.length ? [] : HABITS.map(h => h.id);
      render();
    });
    wrap.querySelectorAll('[data-action="charttype"]').forEach(el => {
      el.addEventListener('click', () => { chartType = el.dataset.val; render(); });
    });
    wrap.querySelectorAll('[data-action="saludmetric"]').forEach(el => {
      el.addEventListener('click', () => { saludMetric = el.dataset.id; render(); });
    });
    const goalsPrevBtn = wrap.querySelector('[data-action="goalsprev"]');
    if (goalsPrevBtn) goalsPrevBtn.addEventListener('click', () => { shiftGoalsRef(objetivosTab, -1); loadGoalForm(); render(); });
    const goalsNextBtn = wrap.querySelector('[data-action="goalsnext"]');
    if (goalsNextBtn) goalsNextBtn.addEventListener('click', () => { shiftGoalsRef(objetivosTab, 1); loadGoalForm(); render(); });
    wrap.querySelectorAll('[data-action="goalfield"]').forEach(el => {
      el.addEventListener('change', () => setGoalField(el.dataset.id, el.value));
    });
    const saveGoalBtn = wrap.querySelector('[data-action="savegoal"]');
    if (saveGoalBtn) saveGoalBtn.addEventListener('click', saveGoal);
    wrap.querySelectorAll('[data-action="configfield"]').forEach(el => {
      el.addEventListener('change', () => setConfigField(el.dataset.id, el.value));
    });
    const saveConfigBtn = wrap.querySelector('[data-action="saveconfig"]');
    if (saveConfigBtn) saveConfigBtn.addEventListener('click', saveConfig);
    wrap.querySelectorAll('[data-action="gotohabit"]').forEach(el => {
      el.addEventListener('click', () => {
        const habit = HABITS.find(h => h.id === el.dataset.id);
        currentCategory = 'habitos';
        currentTab = habit && habit.group === 'night' ? 'noche' : 'manana';
        selectedDate = new Date(today);
        loadFormFromEntry();
        render();
      });
    });
    wrap.querySelectorAll('[data-action="gotosection"]').forEach(el => {
      el.addEventListener('click', () => {
        currentCategory = el.dataset.cat;
        currentTab = el.dataset.tab;
        selectedDate = new Date(today);
        loadFormFromEntry();
        render();
      });
    });
    const sundayBtn = wrap.querySelector('[data-action="gosunday"]');
    if (sundayBtn) sundayBtn.addEventListener('click', () => {
      const d = new Date(selectedDate);
      const daysToAdd = (7 - d.getDay()) % 7; // el botón solo se muestra si hoy no es domingo
      d.setDate(d.getDate() + daysToAdd);
      goToDate(d);
    });

    wrap.querySelectorAll('[data-action="toggle"]').forEach(el => {
      el.addEventListener('click', () => toggleBool(el.dataset.id));
    });
    wrap.querySelectorAll('[data-action="field"]').forEach(el => {
      el.addEventListener('change', () => setField(el.dataset.id, el.value));
    });
    wrap.querySelectorAll('[data-action="sleepfield"]').forEach(el => {
      el.addEventListener('change', () => setSleepPart(el.dataset.part, el.value));
    });
    const prevBtn = wrap.querySelector('[data-action="prevday"]');
    if (prevBtn) prevBtn.addEventListener('click', () => {
      const d = new Date(selectedDate); d.setDate(d.getDate()-1); goToDate(d);
    });
    const nextBtn = wrap.querySelector('[data-action="nextday"]');
    if (nextBtn && !nextBtn.disabled) nextBtn.addEventListener('click', () => {
      const d = new Date(selectedDate); d.setDate(d.getDate()+1); goToDate(d);
    });
    const todayBtn = wrap.querySelector('[data-action="today"]');
    if (todayBtn) todayBtn.addEventListener('click', () => goToDate(today));
    const saveBtn = wrap.querySelector('[data-action="save"]');
    if (saveBtn) saveBtn.addEventListener('click', saveDay);
    const clearBtn = wrap.querySelector('[data-action="clear"]');
    if (clearBtn) clearBtn.addEventListener('click', clearDay);
  }


  async function init() {
    periodRefDate = new Date(today);
    goalsRefDate = new Date(today);
    chartHabitIds = HABITS.map(h => h.id);
    await loadAll();
    configForm = { ...CONFIG };
    loadFormFromEntry();
    loadGoalForm();
    render();
    window.addEventListener('online', () => { flushPendingQueue().then(render); });
    setInterval(() => { if (pendingQueue.length > 0) flushPendingQueue().then(render); }, 30000);
  }
  init();
})();
</script>
</body>
</html>
