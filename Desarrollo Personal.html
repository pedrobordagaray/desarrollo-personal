<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desarrollo Personal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  #habit-root {
    --ink: #1B2430;
    --predawn: #232C3D;
    --predawn-2: #2E394E;
    --paper: #F6F4EF;
    --paper-2: #EDEAE2;
    --sunrise: #E8A33D;
    --sunrise-deep: #D6821F;
    --slate: #8A93A6;
    --clay: #BE6358;
    --line: #DAD5C9;

    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100%;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  #habit-root * { box-sizing: border-box; }
  #habit-root .mono { font-family: 'IBM Plex Mono', monospace; }
  #habit-root .display { font-family: 'Fraunces', serif; }

  #habit-root .wrap {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: flex-start;
  }
  #habit-root .side-rail {
    width: 108px;
    flex-shrink: 0;
    background: var(--predawn);
    min-height: 100vh;
    padding: 20px 8px;
    position: sticky;
    top: 0;
    align-self: flex-start;
  }
  #habit-root .rail-brand {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--paper);
    padding: 4px 8px 16px;
    letter-spacing: 0.02em;
  }
  #habit-root .rail-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 11px 9px;
    border-radius: 9px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
    color: rgba(246,244,239,0.75);
    background: none;
    border: none;
    cursor: pointer;
    margin-bottom: 4px;
    font-family: 'Inter', sans-serif;
  }
  #habit-root .rail-item.active { background: var(--sunrise); color: var(--predawn); }
  #habit-root .rail-item:not(.active):hover { background: rgba(246,244,239,0.1); color: var(--paper); }
  #habit-root .rail-item .soon {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    font-weight: 400;
    color: rgba(246,244,239,0.5);
    margin-top: 2px;
  }
  #habit-root .rail-item.active .soon { color: rgba(35,44,61,0.55); }
  #habit-root .sync-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 18px;
    padding: 8px 9px;
    font-size: 9.5px;
    line-height: 1.3;
    color: rgba(246,244,239,0.6);
    font-family: 'IBM Plex Mono', monospace;
  }
  #habit-root .sync-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--slate);
    flex-shrink: 0;
  }
  #habit-root .sync-dot.ok { background: #4E9A6B; }
  #habit-root .sync-dot.saving { background: var(--sunrise); animation: dp-pulse 1s infinite; }
  #habit-root .sync-dot.pending { background: var(--sunrise-deep); }
  #habit-root .sync-dot.off { background: var(--slate); }
  #habit-root .sync-dot.err { background: var(--clay); }
  @keyframes dp-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  #habit-root .mini-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 20px;
    border-top: 1px solid var(--paper-2);
    font-size: 13.5px;
  }
  #habit-root .mini-row:first-child { border-top: none; }
  #habit-root .mini-label { font-weight: 600; }
  #habit-root .mini-value { color: var(--slate); font-size: 13px; }

  #habit-root .pending-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  #habit-root .pending-item {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--clay);
    background: #fff;
    color: var(--clay);
    cursor: pointer;
  }
  #habit-root .pending-item:hover { background: var(--clay); color: #fff; }
  #habit-root .pending-item.health { border-color: #5B7B9A; color: #5B7B9A; }
  #habit-root .pending-item.health:hover { background: #5B7B9A; color: #fff; }

  #habit-root .section-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-top: 1px solid var(--paper-2);
    padding: 12px 20px;
    font-size: 13.5px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    cursor: pointer;
  }
  #habit-root .section-btn:first-child { border-top: none; }
  #habit-root .section-btn:hover { background: var(--paper-2); }
  #habit-root .status-pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  #habit-root .status-pill.done { background: #E4F1E9; color: #2E7D4F; }
  #habit-root .status-pill.pending { background: #F6E7E4; color: var(--clay); }
  #habit-root .status-pill.na { background: var(--paper-2); color: var(--slate); }

  #habit-root .main-col {
    flex: 1;
    min-width: 0;
    padding: 24px 16px 60px;
  }

  /* ---------- Hero ---------- */
  #habit-root .hero {
    background: linear-gradient(165deg, var(--predawn) 0%, var(--predawn-2) 55%, var(--sunrise-deep) 130%);
    border-radius: 20px;
    padding: 30px 26px 26px;
    color: var(--paper);
    position: relative;
    overflow: hidden;
  }
  #habit-root .hero::after {
    content: "";
    position: absolute;
    right: -60px; bottom: -90px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--sunrise) 0%, rgba(232,163,61,0.15) 55%, transparent 70%);
    pointer-events: none;
  }
  #habit-root .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(246,244,239,0.65);
    margin: 0 0 8px;
  }
  #habit-root .hero h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.08;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  #habit-root .hero p.sub {
    margin: 0;
    font-size: 14px;
    color: rgba(246,244,239,0.78);
    max-width: 40ch;
  }

  /* ---------- Date nav ---------- */
  #habit-root .datenav {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    z-index: 1;
  }
  #habit-root .nav-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(246,244,239,0.3);
    background: rgba(246,244,239,0.08);
    color: var(--paper);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease;
  }
  #habit-root .nav-btn:hover { background: rgba(246,244,239,0.2); }
  #habit-root .nav-btn:disabled { opacity: 0.3; cursor: default; }

  #habit-root .date-display { flex: 1; }
  #habit-root .date-display .big {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
  }
  #habit-root .date-display .small {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: rgba(246,244,239,0.7);
    text-transform: capitalize;
  }
  #habit-root .today-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.05em;
    background: var(--sunrise);
    color: var(--predawn);
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    font-weight: 600;
  }
  #habit-root .today-btn:hover { background: #f0b458; }

  /* ---------- Tab bar ---------- */
  #habit-root .tab-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 18px 2px 4px;
    scrollbar-width: none;
  }
  #habit-root .tab-bar::-webkit-scrollbar { display: none; }
  #habit-root .tab-btn {
    flex-shrink: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.03em;
    padding: 9px 15px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--slate);
    cursor: pointer;
    font-weight: 600;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  #habit-root .tab-btn.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  #habit-root .tab-btn:not(.active):hover {
    border-color: var(--sunrise);
    color: var(--ink);
  }

  /* ---------- Sidebar drawer ---------- */
  #habit-root .cat-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
    position: relative;
    z-index: 1;
  }
  #habit-root .menu-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(246,244,239,0.3);
    background: rgba(246,244,239,0.08);
    color: var(--paper);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  #habit-root .drawer-overlay {
    position: fixed; inset: 0;
    background: rgba(27,36,48,0.5);
    z-index: 40;
  }
  #habit-root .drawer {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 250px; max-width: 80vw;
    background: var(--paper);
    z-index: 41;
    padding: 22px 16px;
    box-shadow: 4px 0 24px rgba(0,0,0,0.18);
    overflow-y: auto;
  }
  #habit-root .drawer h3 {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    margin: 4px 0 18px;
  }
  #habit-root .drawer-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14.5px;
    font-weight: 600;
    margin-bottom: 4px;
    transition: background 0.15s ease;
  }
  #habit-root .drawer-item.active { background: var(--ink); color: var(--paper); }
  #habit-root .drawer-item:not(.active):hover { background: var(--paper-2); }
  #habit-root .drawer-item .soon {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--slate);
    font-weight: 400;
  }
  #habit-root .drawer-item.active .soon { color: rgba(246,244,239,0.6); }
  #habit-root .drawer-close {
    position: absolute; top: 16px; right: 16px;
    background: none; border: none;
    font-size: 20px; color: var(--slate);
    cursor: pointer; line-height: 1;
  }
  #habit-root .soon-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 36px 24px;
    text-align: center;
    margin-top: 18px;
  }
  #habit-root .sunday-hint {
    padding: 12px 20px 0;
    font-size: 12.5px;
    color: var(--slate);
    line-height: 1.5;
  }
  #habit-root .period-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 10px 0 2px;
  }
  #habit-root .period-nav .period-label {
    font-size: 12.5px;
    color: var(--ink);
    font-weight: 600;
    min-width: 140px;
    text-align: center;
    text-transform: capitalize;
  }
  #habit-root .nav-btn.small {
    width: 28px; height: 28px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--ink);
  }
  #habit-root .nav-btn.small:hover { border-color: var(--sunrise); }
  #habit-root .chart-empty {
    padding: 30px 10px;
    text-align: center;
    font-size: 12.5px;
    color: var(--slate);
  }

  /* ---------- Objetivos ---------- */
  #habit-root .goal-row {
    padding: 16px 20px;
    border-top: 1px solid var(--paper-2);
  }
  #habit-root .goal-row .label {
    font-size: 14.5px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  #habit-root .goal-textarea {
    width: 100%;
    min-height: 76px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    color: var(--ink);
    background: var(--paper);
    resize: vertical;
  }
  #habit-root .goal-textarea:focus { outline: none; border-color: var(--sunrise); background: #fff; }

  #habit-root .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  #habit-root .chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.01em;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--slate);
    cursor: pointer;
    font-weight: 600;
  }
  #habit-root .chip.active { border-color: var(--ink); color: var(--ink); }
  #habit-root .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    padding-top: 6px;
  }
  #habit-root .legend-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--slate);
  }
  #habit-root .legend-chip .sw {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 2px;
  }

  /* ---------- Checklist card ---------- */
  #habit-root .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    margin-top: 18px;
    overflow: hidden;
  }
  #habit-root .card-head {
    padding: 18px 20px 6px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  #habit-root .card-head h2 {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    margin: 0;
    font-weight: 600;
  }
  #habit-root .day-score {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--slate);
    text-align: right;
    max-width: 60%;
  }
  #habit-root .day-score b { color: var(--sunrise-deep); }

  #habit-root .habit-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    border-top: 1px solid var(--paper-2);
  }
  #habit-root .habit-info { flex: 1; min-width: 0; }
  #habit-root .habit-info .label {
    font-size: 14.5px;
    font-weight: 600;
  }
  #habit-root .habit-info .target {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--slate);
    margin-top: 2px;
  }

  /* sun toggle */
  #habit-root .sun-toggle {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--paper);
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    transition: all 0.18s ease;
  }
  #habit-root .sun-toggle::before {
    content: "";
    position: absolute; inset: 6px;
    border-radius: 50%;
    background: transparent;
    transition: all 0.18s ease;
  }
  #habit-root .sun-toggle.on {
    border-color: var(--sunrise);
    background: var(--sunrise);
    box-shadow: 0 0 0 4px rgba(232,163,61,0.18);
  }
  #habit-root .sun-toggle.on::before { background: #fff; }
  #habit-root .sun-toggle.off {
    border-color: var(--clay);
    background: var(--clay);
    box-shadow: 0 0 0 4px rgba(190,99,88,0.14);
  }
  #habit-root .sun-toggle.off::before { background: #fff; }

  #habit-root .time-input, #habit-root .num-input {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    border: 1.5px solid var(--line);
    border-radius: 9px;
    padding: 8px 10px;
    background: var(--paper);
    color: var(--ink);
    width: 92px;
    text-align: center;
    flex-shrink: 0;
  }
  #habit-root .time-input:focus, #habit-root .num-input:focus {
    outline: none;
    border-color: var(--sunrise);
  }
  #habit-root .sleep-fields {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }
  #habit-root .sleep-num {
    width: 50px;
    padding: 8px 4px;
  }
  #habit-root .sleep-unit {
    font-size: 11.5px;
    color: var(--slate);
  }
  #habit-root .ok-flag {
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
  }
  #habit-root .ok-flag.yes { background: rgba(232,163,61,0.18); color: var(--sunrise-deep); }
  #habit-root .ok-flag.no { background: rgba(190,99,88,0.14); color: var(--clay); }
  #habit-root .ok-flag.empty { background: transparent; color: var(--line); }

  #habit-root .save-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 16px 20px 20px;
  }
  #habit-root .save-btn {
    flex: 1;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  #habit-root .save-btn:hover { background: #2E3A4E; }
  #habit-root .save-btn:disabled { opacity: 0.5; cursor: default; }
  #habit-root .save-msg {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--sunrise-deep);
    min-height: 16px;
  }

  /* ---------- Dashboard ---------- */
  #habit-root .section-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--slate);
    margin: 34px 2px 12px;
  }

  #habit-root .dash-top {
    display: flex;
    gap: 16px;
    align-items: stretch;
  }
  #habit-root .ring-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 0 0 160px;
  }
  #habit-root .ring {
    width: 108px; height: 108px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  #habit-root .ring-inner {
    width: 82px; height: 82px;
    border-radius: 50%;
    background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #habit-root .ring-inner .pct {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
  }
  #habit-root .ring-inner .lbl {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--slate);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  #habit-root .ring-caption {
    margin-top: 10px;
    font-size: 12px;
    text-align: center;
    color: var(--slate);
  }

  #habit-root .stat-stack {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #habit-root .stat-box {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px 18px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #habit-root .stat-box .num {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    color: var(--sunrise-deep);
  }
  #habit-root .stat-box .lbl {
    font-size: 12.5px;
    color: var(--slate);
    text-align: right;
    max-width: 15ch;
  }

  #habit-root .bars-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px 20px 8px;
    margin-top: 16px;
  }
  #habit-root .bar-item {
    border-top: 1px solid var(--paper-2);
    padding: 9px 0 6px;
  }
  #habit-root .bar-item:first-child { border-top: none; }
  #habit-root .bar-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #habit-root .bar-streak {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--slate);
    padding-left: 2px;
    margin-top: 3px;
  }

<div id="habit-root">
  <div class="wrap" id="app-wrap">
    <div class="loading">Cargando tu registro…</div>
  </div>
</div>

<script>
(function () {
  // Fecha desde la que cada hábito empieza a contar para el % de
  // cumplimiento. Los 11 hábitos base arrancan el 1° de septiembre de 2026
  // (cuando Pedro empieza a usar la app en serio). Si en el futuro se suma
  // un hábito nuevo, se le pone su propia fecha de alta acá — así los meses
  // anteriores a esa fecha no se recalculan con un divisor distinto.
  const HABITS_START = new Date(2026, 8, 1); // 1 de septiembre de 2026

  const HABITS = [
    { id: 'control', label: 'Control de hábitos', desc: 'Revisé y registré mi día', type: 'bool', group: 'morning', activeSince: HABITS_START },
    { id: 'wake', label: 'Hora de levantada', desc: 'Meta: antes de las 06:00', type: 'time', target: '06:00', group: 'morning', activeSince: HABITS_START },
    { id: 'sleep', label: 'Horas de sueño', desc: 'Meta: entre 7 y 8 h', type: 'sleep', min: 7, max: 8, group: 'morning', activeSince: HABITS_START },
    { id: 'plan', label: 'Planificación diaria', desc: 'Planifiqué las tareas del día', type: 'bool', group: 'morning', activeSince: HABITS_START },
    { id: 'vision', label: 'Leer misión y visión', desc: 'Leí mi misión y visión personal', type: 'bool', group: 'morning', activeSince: HABITS_START },
    { id: 'walk', label: 'Caminata / trote', desc: 'Actividad física del día', type: 'bool', group: 'morning', activeSince: HABITS_START },
    { id: 'lectura', label: 'Lectura', desc: 'Dediqué tiempo a leer', type: 'bool', group: 'night', activeSince: HABITS_START },
    { id: 'food', label: 'Alimentación saludable', desc: 'Comidas equilibradas, sin excesos', type: 'bool', group: 'night', activeSince: HABITS_START },
    { id: 'water', label: 'Agua', desc: 'Meta: mínimo 2 litros', type: 'liters', min: 2, group: 'night', activeSince: HABITS_START },
    { id: 'alcohol', label: 'Alcohol 0', desc: 'Sin consumo de alcohol', type: 'bool', group: 'night', activeSince: HABITS_START },
    { id: 'finance', label: 'Control de finanzas personales', desc: 'Registré/revisé mis finanzas del día', type: 'bool', group: 'night', activeSince: HABITS_START },
  ];

  // Hábitos que solo se completan los domingos. Se guardan en la misma
  // fila diaria (misma fecha) que el resto — no llevan compliance % propio.
  const WEEKLY_HABITS = [
    { id: 'plan_semanal', label: 'Planificación semanal', desc: 'Domingos · organicé la semana', type: 'bool' },
    { id: 'menu_semanal', label: 'Menú semanal', desc: 'Domingos · planifiqué las comidas', type: 'bool' },
  ];

  // Métricas de sueño (Garmin) — carga manual, informativa, sin meta de
  // cumplimiento estricta. Se guardan también en la fila diaria.
  const SLEEP_FIELDS = [
    { id: 'sleep_score', label: 'Puntaje de sueño', desc: 'Escala 0–100', unit: 'pts', min: 0, max: 100, step: 1, time: 'morning' },
    { id: 'sleep_deep', label: 'Sueño profundo', desc: 'Minutos', unit: 'min', min: 0, max: 600, step: 5, time: 'morning' },
    { id: 'sleep_light', label: 'Sueño liviano', desc: 'Minutos', unit: 'min', min: 0, max: 600, step: 5, time: 'morning' },
    { id: 'sleep_rem', label: 'Sueño REM', desc: 'Minutos', unit: 'min', min: 0, max: 600, step: 5, time: 'morning' },
    { id: 'resting_hr', label: 'FC en reposo', desc: 'Latidos por minuto', unit: 'bpm', min: 20, max: 150, step: 1, time: 'morning' },
    { id: 'body_battery', label: 'Body battery', desc: 'Fin del día · escala 0–100', unit: 'pts', min: 0, max: 100, step: 1, time: 'evening' },
    { id: 'stress', label: 'Estrés', desc: 'Fin del día · escala 0–100', unit: 'pts', min: 0, max: 100, step: 1, time: 'evening' },
  ];

  // ---- Salud ampliada (Cambio 10) — métricas opcionales, NUNCA afectan
  // el % de cumplimiento diario (no son hábitos, son datos). ----
  const BODY_FIELDS = [
    { id: 'weight', label: 'Peso', desc: 'Kilogramos · 1 vez por semana, sábados', unit: 'kg', min: 30, max: 250, step: 0.1 },
    { id: 'waist', label: 'Cintura', desc: 'Centímetros · 1 vez por semana, sábados', unit: 'cm', min: 40, max: 200, step: 0.5 },
  ];
  const TRAINING_TYPES = ['Caminata', 'Trote', 'Gimnasio', 'Ski', 'Bicicleta', 'Otro'];
  const TRAINING_FIELDS = [
    { id: 'training_duration', label: 'Duración', desc: 'Minutos', unit: 'min', min: 0, max: 600, step: 5 },
    { id: 'training_distance', label: 'Distancia', desc: 'Kilómetros', unit: 'km', min: 0, max: 300, step: 0.1 },
    { id: 'training_steps', label: 'Pasos', desc: '', unit: 'pasos', min: 0, max: 60000, step: 100 },
    { id: 'training_hr_avg', label: 'FC media', desc: '', unit: 'bpm', min: 0, max: 230, step: 1 },
    { id: 'training_hr_max', label: 'FC máxima', desc: '', unit: 'bpm', min: 0, max: 230, step: 1 },
    { id: 'training_vo2max', label: 'VO₂ Max', desc: '', unit: 'ml/kg/min', min: 0, max: 90, step: 0.1 },
  ];

  // ---- Conexión con Google Sheets (Apps Script) ----
  const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzOHNS3gGFqPTWu85-gOsLRcBQfyOyaUleL82ybGld3XpjWx_90TlOMcmNW3_nKkMkM/exec';
  // NOTA DE SEGURIDAD: en una app cliente (HTML/JS que corre en el navegador)
  // no existe forma de ocultar de verdad una clave — cualquiera que abra el
  // código fuente puede leer esto. SECRET_KEY es solo una traba simple para
  // que no cualquiera que encuentre la URL del Apps Script escriba en la
  // planilla por accidente; NO es autenticación fuerte. Si en algún momento
  // se comparte este archivo, conviene cambiar esta clave y la del Apps
  // Script. Una autenticación real (OAuth, tokens por usuario, etc.)
  // requeriría un backend propio — queda fuera del alcance actual.
  const SECRET_KEY = '1009';

  // Mapeo entre los ids internos y las columnas de la planilla
  function toSheetEntry(f, score) {
    return {
      control_habitos: f.control === undefined ? null : f.control,
      hora_levantada: f.wake === '' || f.wake === undefined ? null : f.wake,
      sueno_horas: f.sleep_h === '' || f.sleep_h === undefined ? null : Number(f.sleep_h),
      sueno_minutos: f.sleep_m === '' || f.sleep_m === undefined ? null : Number(f.sleep_m),
      planificacion_diaria: f.plan === undefined ? null : f.plan,
      mision_vision: f.vision === undefined ? null : f.vision,
      lectura: f.lectura === undefined ? null : f.lectura,
      caminata_trote: f.walk === undefined ? null : f.walk,
      alimentacion_saludable: f.food === undefined ? null : f.food,
      agua_litros: f.water === '' || f.water === undefined ? null : Number(f.water),
      alcohol_cero: f.alcohol === undefined ? null : f.alcohol,
      finanzas_personales: f.finance === undefined ? null : f.finance,
      planificacion_semanal: f.plan_semanal === undefined ? null : f.plan_semanal,
      menu_semanal: f.menu_semanal === undefined ? null : f.menu_semanal,
      sleep_score: numOrNull(f.sleep_score),
      sleep_deep: numOrNull(f.sleep_deep),
      sleep_light: numOrNull(f.sleep_light),
      sleep_rem: numOrNull(f.sleep_rem),
      resting_hr: numOrNull(f.resting_hr),
      body_battery: numOrNull(f.body_battery),
      stress: numOrNull(f.stress),
      peso_kg: numOrNull(f.weight),
      cintura_cm: numOrNull(f.waist),
      entrenamiento_realizado: f.training_done === undefined ? null : f.training_done,
      entrenamiento_tipo: f.training_type || null,
      entrenamiento_duracion_min: numOrNull(f.training_duration),
      entrenamiento_distancia_km: numOrNull(f.training_distance),
      entrenamiento_pasos: numOrNull(f.training_steps),
      entrenamiento_fc_media: numOrNull(f.training_hr_avg),
      entrenamiento_fc_maxima: numOrNull(f.training_hr_max),
      entrenamiento_vo2max: numOrNull(f.training_vo2max),
      cumplimiento_pct: score === null ? null : Math.round(score * 10000) / 10000,
    };
  }
  function numOrNull(v) { return (v === '' || v === undefined || v === null || isNaN(Number(v))) ? null : Number(v); }
  function valOrNull(v) { return v === undefined ? null : v; }
  function sleepDecimalFromParts(h, m) {
    if ((h === '' || h === undefined || h === null) && (m === '' || m === undefined || m === null)) return '';
    const hh = (h === '' || h === undefined || h === null) ? 0 : Number(h);
    const mm = (m === '' || m === undefined || m === null) ? 0 : Number(m);
    return Math.round((hh + mm / 60) * 100) / 100;
  }
  function fromSheetEntry(e) {
    const entry = {
      control: valOrNull(e.control_habitos),
      wake: (e.hora_levantada !== undefined && e.hora_levantada !== null) ? e.hora_levantada : '',
      sleep_h: (e.sueno_horas !== undefined && e.sueno_horas !== null) ? e.sueno_horas : '',
      sleep_m: (e.sueno_minutos !== undefined && e.sueno_minutos !== null) ? e.sueno_minutos : '',
      plan: valOrNull(e.planificacion_diaria),
      vision: valOrNull(e.mision_vision),
      lectura: valOrNull(e.lectura),
      walk: valOrNull(e.caminata_trote),
      food: valOrNull(e.alimentacion_saludable),
      water: (e.agua_litros !== undefined && e.agua_litros !== null) ? e.agua_litros : '',
      alcohol: valOrNull(e.alcohol_cero),
      finance: valOrNull(e.finanzas_personales),
      plan_semanal: valOrNull(e.planificacion_semanal),
      menu_semanal: valOrNull(e.menu_semanal),
      sleep_score: numFieldOrEmpty(e.sleep_score),
      sleep_deep: numFieldOrEmpty(e.sleep_deep),
      sleep_light: numFieldOrEmpty(e.sleep_light),
      sleep_rem: numFieldOrEmpty(e.sleep_rem),
      resting_hr: numFieldOrEmpty(e.resting_hr),
      body_battery: numFieldOrEmpty(e.body_battery),
      stress: numFieldOrEmpty(e.stress),
      weight: numFieldOrEmpty(e.peso_kg),
      waist: numFieldOrEmpty(e.cintura_cm),
      training_done: valOrNull(e.entrenamiento_realizado),
      training_type: e.entrenamiento_tipo || '',
      training_duration: numFieldOrEmpty(e.entrenamiento_duracion_min),
      training_distance: numFieldOrEmpty(e.entrenamiento_distancia_km),
      training_steps: numFieldOrEmpty(e.entrenamiento_pasos),
      training_hr_avg: numFieldOrEmpty(e.entrenamiento_fc_media),
      training_hr_max: numFieldOrEmpty(e.entrenamiento_fc_maxima),
      training_vo2max: numFieldOrEmpty(e.entrenamiento_vo2max),
    };
    entry.sleep = sleepDecimalFromParts(entry.sleep_h, entry.sleep_m);
    return entry;
  }
  function numFieldOrEmpty(v) { return (v !== undefined && v !== null && v !== '') ? v : ''; }

  const WEEKDAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  let entries = {};
  let today = new Date();
  today.setHours(0,0,0,0);
  let selectedDate = new Date(today);
  let form = {};
  let saveMsg = '';
  let storageOK = true;
  let currentCategory = 'hoy';
  let currentTab = 'manana';       // sub-tab dentro de Hábitos o Salud
  let dashboardTab = 'habitos';    // sub-tab dentro de Dashboard
  let periodMode = 'year';
  let periodRefDate = null;        // se inicializa a "today" en init()

  let objetivosTab = 'anual';      // sub-tab dentro de Objetivos
  let goalsRefDate = null;         // se inicializa a "today" en init()
  let goals = {};                  // { periodo_key: { prof, fin, salud, creci, tipo } }
  let goalForm = { prof: '', fin: '', salud: '', creci: '' };
  let goalSaveMsg = '';

  let chartHabitIds = [];          // hábitos seleccionados en los gráficos por semana/mes (se inicializa a "todos" en init())
  let chartType = 'line';          // 'line' | 'bar'
  let saludMetric = 'sleep_score'; // métrica elegida en Dashboard > Salud > Evolución
  const PALETTE = ['#E8A33D','#BE6358','#5B7B9A','#7F77DD','#4E9A6B','#C9518C','#D6821F','#3E8E8E','#A15C9E','#8A93A6','#2E394E'];

  // ---- Configuración central ----
  // Valores por defecto = lo que ya estaba funcionando hasta ahora (no se
  // cambia el comportamiento actual solo por introducir esta pantalla).
  // Se pueden editar desde la categoría "Configuración" y quedan guardados
  // en la hoja "Configuracion" del Sheet.
  const CONFIG_DEFAULTS = {
    wakeTarget: '06:00',
    sleepMin: 7,
    sleepMax: 8,
    waterMin: 2,
    dailyGoalPct: 80,
    trainingDaysPerWeek: 3,
  };
  // Historial de configuración: cada cambio se agrega como una entrada
  // nueva con la fecha desde la que rige, en vez de sobreescribir un único
  // valor. Así, cambiar la hora de levantada (o cualquier otra meta) hoy
  // NO recalcula el cumplimiento de los días pasados — cada día usa la
  // configuración que regía en su propia fecha. Ordenado ascendente por
  // effectiveFrom.
  let configHistory = [];
  // "CONFIG" = la configuración vigente hoy, para mostrar en pantallas
  // que no están atadas a una fecha específica (ej. el formulario de
  // Configuración). Los cálculos de cumplimiento SIEMPRE usan configAt(date),
  // nunca esta variable directamente.
  let CONFIG = { ...CONFIG_DEFAULTS };
  let configForm = { ...CONFIG_DEFAULTS };
  let configSaveMsg = '';

  function configAt(date) {
    let applicable = CONFIG_DEFAULTS;
    for (let i = 0; i < configHistory.length; i++) {
      if (keyToDate(configHistory[i].effectiveFrom) <= date) applicable = configHistory[i];
      else break;
    }
    return applicable;
  }

  // ---- Estado de sincronización + cache local (IndexedDB) ----
  // 'synced' | 'saving' | 'pending' | 'offline' | 'error'
  let syncStatus = 'offline';
  let pendingQueue = []; // operaciones que fallaron y quedan para reintentar

  const CATEGORIES = [
    { id: 'hoy', label: 'Hoy', ready: true },
    { id: 'habitos', label: 'Hábitos', ready: true },
    { id: 'salud', label: 'Salud', ready: true },
    { id: 'dashboard', label: 'Dashboard', ready: true },
    { id: 'objetivos', label: 'Objetivos', ready: true },
    { id: 'config', label: 'Configuración', ready: true },
    { id: 'vision', label: 'Misión y Visión', ready: false },
    { id: 'finanzas', label: 'Finanzas', ready: false },
    { id: 'biblioteca', label: 'Biblioteca', ready: false },
  ];
  const HABIT_TABS = [
    { id: 'manana', label: 'Mañana' },
    { id: 'noche', label: 'Noche' },
    { id: 'semanal', label: 'Semanal' },
  ];
  const SALUD_TABS = [
    { id: 'manana', label: 'Al despertar' },
    { id: 'entrenamiento', label: 'Entrenamiento' },
    { id: 'noche', label: 'Fin del día' },
  ];
  const DASHBOARD_TABS = [
    { id: 'habitos', label: 'Hábitos' },
    { id: 'salud', label: 'Salud' },
    { id: 'insights', label: 'Insights' },
  ];
  const PERIODS = [
    { id: 'week', label: 'Semana' },
    { id: 'month', label: 'Mes' },
    { id: 'quarter', label: 'Trimestre' },
    { id: 'year', label: 'Año' },
